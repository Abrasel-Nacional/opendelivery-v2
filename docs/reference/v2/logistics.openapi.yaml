  description: Staging / homologation environment
  x-internal: true
security:
- bearerAuth: []
tags:
- name: ReleaseNotes
  x-displayName: Release notes
  x-traitTag: true
  description: |-
    ## Release Candidate status

    This contract is part of Open Delivery Protocol **V2.0.0-rc** (Release Candidate).
    It is published for **ecosystem validation**: company review and implementation pilots.
    Clarifying or corrective changes may still occur based on pilot feedback.
    A stable release will follow only after validation completes.
    **V1 remains the production reference** during the transition.

    ## V1 continuity

    V2 Logistics **preserves V1 behavior**. All endpoints, schemas, and flows are
    functionally identical to V1. The only changes are organizational (tagging,
    grouping) and the removal of the `/v1/` path prefix.

- name: CapabilityOverview
  x-displayName: Overview
  x-traitTag: true
  description: |-
    ## Logistics capability

    Open Delivery provides a set of standards so that both merchants through their **Software Services** and **Ordering Applications** can request a new delivery to a logistics operator and track this delivery.

    ## Logistics API Usage

    Open Delivery's Logistic API aims to standardize the communication between a **requester** - which can be either a **Software Service** or an **Ordering Application** - and a company's software that provides **Logistic Services** (called here **Logistic Service**).

    > A **Logistic Service** can be either a company that specializes in delivery services or an **Ordering Application** that also provides delivery services.

    > The Open Delivery logistics API only handles communications between the merchant software (or **Ordering Application**) and the software of the logistics operator. Communications and interfaces with the deliverers at the end are not covered in this documentation, leaving it up to the logistics companies to perform this interaction.

    The endpoints provided here, cover the following functionalities:

    ### Delivery Order

    It covers the calling of a new delivery, as well as auxiliary endpoints for reporting the pickup of an order, the completion of the delivery, as well as problem handling and cancellations.

    ### Delivery Tracking
    Webhook to be available at the **requester's** side of the call, in order to receive all order event updates, as well as delivery information updates.

    ### Delivery Availability and Price

    Endpoint with the function of simulating a new delivery, with the purpose of checking if it is possible to make the delivery as well as its prices and times.

- name: IntegrationProfile
  x-displayName: 'Auth & Discovery'
  x-traitTag: true
  description: |-
    ## Authentication

    All endpoints require `Authorization: Bearer {token}` unless marked otherwise.

    OAuth 2.0 grant models, scopes, and webhook signature validation (HMAC-SHA256)
    are defined in the [Authentication specification](../authentication/).

    Preferred scope for this capability: `od.logistics`.

    <SecurityDefinitions />

    ### Webhook headers

    Logistics event webhooks (`newLogisticEvent`, `confirmationCode`) include
    security headers for verification:

    | Header | Description |
    |---|---|
    | `X-App-Id` | Unique identifier of the **Logistic Service** |
    | `X-App-MerchantId` | Unique identifier of the **Merchant** receiving the event |
    | `X-App-Signature` | HMAC-SHA256 of the request body, using the client secret as key |

    The receiving party MUST validate `X-App-Signature` before processing.

    ## Discovery declarations

    Implementations MUST publish Logistics capability behavior in
    [Discovery](../discovery/) so counterparties can integrate predictably.

    At minimum, declare:
    - `capabilities.logistics.version` and `capabilities.logistics.supported`.
    - `capabilities.logistics.originator.supportedEvents` — events emitted by the logistics provider.
    - `capabilities.logistics.originator.supportsWebhook` — whether push delivery of events is available.
    - `capabilities.logistics.originator.supportsPolling` — whether pull consumption of events is available.
    - `capabilities.logistics.receiver.supportedOperations` — operations accepted by the receiver.

    ### Example Discovery fragment

    ```json
    {
      "capabilities": {
        "logistics": {
          "version": "2.0.0-rc",
          "supported": true,
          "originator": {
            "supportedEvents": [
              "PENDING", "ACCEPTED", "REJECTED", "PICKUP_ONGOING",
              "ARRIVED_AT_MERCHANT", "ORDER_PICKED", "DELIVERY_ONGOING",
              "ARRIVED_AT_CUSTOMER", "ORDER_DELIVERED",
              "RETURNING_TO_MERCHANT", "RETURNED_TO_MERCHANT",
              "DELIVERY_FINISHED", "CANCELLED"
            ],
            "supportsWebhook": true,
            "supportsPolling": false
          },
          "receiver": {
            "supportedOperations": [
              "logisticsNewDelivery", "logisticsReadyForPickup",
              "logisticsPicked", "logisticsFinish",
              "logisticsProblem", "logisticsCancel",
              "logisticsAvailability", "logisticDetails"
            ]
          }
        }
      }
    }
    ```

