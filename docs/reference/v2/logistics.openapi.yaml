openapi: 3.1.0
info:
  title: Open Delivery V2 — Logistics
  version: 2.0.0-rc
  summary: Normative Logistics contracts — delivery lifecycle, tracking, and availability
  description: |-
    This specification is the **normative, self-contained contract** of Open Delivery
    for the **logistics domain**: delivery ordering, tracking events, availability
    and pricing.

    Recommended reading flow in ReDoc:
    1. **Release notes** (RC status and V1 continuity)
    2. **Overview** (logistics model, parties, and flows)
    3. **Integration** (authentication and Discovery declarations)
    4. **Delivery** (delivery lifecycle endpoints)
    5. **Delivery Tracking** (webhooks for event notifications)
    6. **Availability** (delivery availability and pricing)
    7. **External docs** (related capabilities and guides)

    An implementer MUST be able to integrate this capability using **only this document**.
    Related guides are listed under **External docs**.
