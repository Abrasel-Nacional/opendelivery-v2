paths:
  /customers:
    get:
      tags: [Customers]
      summary: List and query customers with filters
      operationId: listCustomers
      description: |-
        Queries customers in a paginated manner, prioritizing filters over
        single-identifier navigation. Recommended for CRM integrations
        and bulk import/query.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      parameters:
        - $ref: '#/components/parameters/merchantId'
        - $ref: '#/components/parameters/customerIdentifierType'
        - $ref: '#/components/parameters/customerIdentifierValue'
        - $ref: '#/components/parameters/externalId'
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Customers]
      summary: Import or synchronize customers in batch
      operationId: upsertCustomers
      description: |-
        Import/synchronization of customers. Supports small to medium batches,
        according to the limits declared in the discovery document.
        Processing is asynchronous — `202 Accepted` confirms receipt of the batch,
        not the individual persistence of each record.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpsertRequest'
      responses:
        '202':
          description: Batch received for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /leads:
    get:
      tags: [Leads]
      summary: List leads with filters
      operationId: listLeads
      description: |-
        Queries leads in a paginated manner. Recommended for initial synchronization
        or data reconciliation between the platform and the CRM.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      parameters:
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of leads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Leads]
      summary: Import or synchronize leads in batch
      operationId: upsertLeads
      description: |-
        Import/synchronization of leads. Processing is asynchronous —
        `202 Accepted` confirms receipt of the batch, not individual persistence.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpsertRequest'
      responses:
        '202':
          description: Batch received for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    get:
      tags: [Orders]
      summary: Query orders in batch/history for CRM use
      operationId: listOrders
      description: |-
        Queries orders in a paginated manner for customer profile enrichment
        in the CRM. This operation does **not** replicate the operational order
        lifecycle — for that, consult the Orders specification.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      parameters:
        - $ref: '#/components/parameters/customerIdentifierType'
        - $ref: '#/components/parameters/customerIdentifierValue'
        - $ref: '#/components/parameters/storeId'
        - $ref: '#/components/parameters/originChannel'
        - $ref: '#/components/parameters/createdFrom'
        - $ref: '#/components/parameters/createdTo'
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Orders]
      summary: Import or synchronize orders in batch
      operationId: upsertOrders
      description: |-
        Batch import of orders for CRM integration. Processing is
        asynchronous — `202 Accepted` confirms receipt of the batch, not the individual
        persistence of each record.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpsertRequest'
      responses:
        '202':
          description: Batch received for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Query a specific order
      operationId: getOrderById
      description: |-
        Optional endpoint for scenarios that require direct lookup of a known order.
        The integration continues to favor filter-based and batch queries.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Order found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reviews:
    get:
      tags: [Reviews]
      summary: List reviews with filters
      operationId: listReviews
      description: |-
        Queries reviews in a paginated manner with filters by customer, order, and period.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      parameters:
        - $ref: '#/components/parameters/merchantId'
        - $ref: '#/components/parameters/customerIdentifierType'
        - $ref: '#/components/parameters/customerIdentifierValue'
        - $ref: '#/components/parameters/orderIdQuery'
        - $ref: '#/components/parameters/createdFrom'
        - $ref: '#/components/parameters/createdTo'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Reviews]
      summary: Submit reviews to the CRM
      operationId: createReviews
      description: |-
        The Ordering Application sends customer reviews to the CRM in batch.
        Processing is asynchronous — `202 Accepted` confirms receipt of the batch.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpsertRequest'
      responses:
        '202':
          description: Batch received for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      summary: Query a specific review
      operationId: getReviewById
      description: |-
        Direct lookup of a review by its identifier.

        | **Hosted by** | Software Service (CRM) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (CRM)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
