          description: Paginated list of loyalty programs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgramListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Loyalty]
      summary: Register or synchronize loyalty programs
      operationId: upsertLoyaltyPrograms
      description: |-
        Registration or synchronization of loyalty programs in batch.
        Processing is asynchronous — `202 Accepted` confirms receipt of the batch.

        | **Hosted by** | Software Service (Loyalty) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (Loyalty)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
