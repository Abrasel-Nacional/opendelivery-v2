openapi: 3.1.0
x-spectral-ignore:
  - owasp:api4:2023-string-restricted
info:
  title: Open Delivery V2 — Customer
  version: 2.0.0-rc.2
  summary: Normative Customer contracts — customer data, leads, relationship orders, reviews, loyalty, and events
  description: |-
    This specification is the **normative, self-contained contract** of Open Delivery
    for the **Customer** capability: customer records, leads, order history in a
    customer-data context, reviews, relationship events, and loyalty programs.

    Recommended reading flow:
    1. **Release notes** (RC status, new capability note)
    2. **Overview** (modules, parties, happy paths)
    3. **Auth & Discovery** (scopes, webhook signing, Discovery declarations)
    4. **Customer data** (customers, leads, orders, events)
    5. **Reviews** (ratings and feedback)
    6. **Loyalty** (programs, accounts, rewards, coupons, redemptions)

    An implementer MUST be able to integrate using **only this document** for the modules
    they implement. Guides are listed under **External docs**.

