  /loyalty/coupons/{couponId}/use:
    parameters:
      - name: couponId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the coupon to consume.

    post:
      tags: [Loyalty]
      summary: Consume (use) a loyalty coupon
      operationId: useLoyaltyCoupon
      description: |-
        Confirms that an exclusive/single-use coupon has been consumed — transitions
        its status from `available` or `applied` to `used`.

        This endpoint is called by the **Ordering Application** after verifying that
        the coupon was applied to a completed order. It signals the loyalty host
        to mark the coupon as definitively consumed, preventing reuse.

        **This endpoint is for exclusive/single-use coupons only** (e.g., coupons
        generated by `createLoyaltyRedemption`). Shared promotional codes (type 1)
        are handled via `discounts[].discountCode` in the Orders capability and do
        not need individual redemption.

        **Typical flow:**
        1. Customer applies exclusive coupon at checkout (status: `applied`).
        2. Order is confirmed and fulfilled.
        3. OA calls `POST /loyalty/coupons/{couponId}/use` to finalize consumption.
        4. Loyalty host transitions coupon to `used` (or decrements remaining uses
           for multi-use titular coupons).
        5. Loyalty host emits `loyalty.coupon.used` event via webhook.

        **Idempotency:** Idempotent by (`couponId`, `relatedOrderId`). If the coupon
        is already `used` for the same order, return `200` with current state.
        If the coupon is `expired` or `cancelled`, return `409 Conflict`.

        | **Hosted by** | Software Service (Loyalty) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (Loyalty)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                relatedOrderId:
                  type: string
                  description: Identifier of the order where this coupon was applied and consumed. Used for traceability and idempotency.
                  example: order-abc123
      responses:
        '200':
          description: Coupon successfully consumed (or already consumed for this order — idempotent success).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCoupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Coupon not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Coupon cannot be consumed in its current state (already used for a different order, expired, or cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loyalty/redemptions:
    post:
      tags: [Loyalty]
      summary: Request reward redemption
      operationId: createLoyaltyRedemption
      description: |-
        Initiates the redemption of a reward from the catalog for the customer. The operation
        debits the required points/cashback and generates the corresponding benefit.
        Processing is asynchronous — `202 Accepted` confirms the start of the redemption.

        > **Balance validation MUST occur before accepting the redemption.**
        > If the balance is insufficient, return `409 Conflict`.

        | **Hosted by** | Software Service (Loyalty) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- POST --> SS["Software Service (Loyalty)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyRedemptionRequest'
      responses:
        '202':
          description: Redemption request received for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

webhooks:
  customerEvent:
    post:
      tags: [CustomerEvents]
      summary: Customer-focused event webhook
      operationId: receiveCustomerEvent
      description: |-
        Asynchronous webhook consumed by the Ordering Application to receive events
        with direct relevance to CRM — without replicating the complete operational
        order lifecycle. As with all protocol webhooks, the request MUST carry the
        HMAC-SHA256 signature headers (`X-App-Id`, `X-App-MerchantId`, `X-App-Signature`)
        defined in the [Authentication specification](../authentication/).

        | **Hosted by** | Ordering Application (webhook endpoint) |
        |---|---|
        | **Called by** | Software Service (CRM) |

        ```mermaid
        graph LR
