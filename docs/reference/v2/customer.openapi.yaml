components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer Token issued via OAuth 2.0. Consult the
        [Authentication specification](../authentication/) for the supported grant
        models (`client_credentials_merchant`,
        `client_credentials_application`, `authorization_code`).

  parameters:
    merchantId:
      in: query
      name: merchantId
      schema:
        type: string
      description: |
        **[DRAFT — pendente comitê]** Filter by merchant (establishment) identifier.
        When omitted, the response includes data from all merchants authorized for the
        calling application (default `by_app` behavior). When provided, the response is
        scoped to the specified merchant only.
    page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Query page (starts at 1).
    pageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description: Number of records per page (maximum as per discovery).
    createdFrom:
      in: query
      name: createdFrom
      schema:
        type: string
        format: date-time
      description: Filter by creation start date/time (ISO 8601).
    createdTo:
      in: query
      name: createdTo
      schema:
        type: string
        format: date-time
      description: Filter by creation end date/time (ISO 8601).
    updatedFrom:
      in: query
      name: updatedFrom
      schema:
        type: string
        format: date-time
      description: Filter by update start date/time (ISO 8601).
    updatedTo:
      in: query
      name: updatedTo
      schema:
        type: string
        format: date-time
      description: Filter by update end date/time (ISO 8601).
    customerIdentifierType:
      in: query
      name: customerIdentifierType
      schema:
        type: string
      description: "Type of the customer's canonical identifier (e.g., `phone`, `email`, `document`, `external_id`)."
    customerIdentifierValue:
      in: query
      name: customerIdentifierValue
      schema:
        type: string
      description: Value of the customer's canonical identifier.
    externalId:
      in: query
      name: externalId
      schema:
        type: string
      description: External identifier for cross-system correlation and deduplication.
    storeId:
      in: query
      name: storeId
      schema:
        type: string
      description: Store/unit identifier to filter orders by origin.
    originChannel:
      in: query
      name: originChannel
      schema:
        $ref: '#/components/schemas/OriginChannel'
      description: Order channel/origin for filtering.
    orderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
      description: Unique identifier of the order.
    orderIdQuery:
      in: query
      name: orderId
      schema:
        type: string
      description: Order identifier for review filtering.
    reviewId:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
      description: Unique identifier of the review.
    programId:
      in: path
      name: programId
      required: true
      schema:
        type: string
      description: Unique identifier of the loyalty program.
    programIdQuery:
      in: query
      name: programId
      schema:
        type: string
      description: Loyalty program identifier for filtering.
    accountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
      description: Unique identifier of the loyalty account.
    customerId:
      in: path
      name: customerId
      required: true
      schema:
        type: string
      description: Unique identifier of the customer.
    customerIdQuery:
      in: query
      name: customerId
      schema:
        type: string
      description: Customer identifier for coupon and account filtering.
    XAppId:
      in: header
      name: X-App-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Unique identifier of the Software Service sending the webhook. Detailed in the
        [Authentication specification](../authentication/).
    XAppMerchantId:
      in: header
      name: X-App-MerchantId
      required: true
      schema:
        type: string
      description: >
        Unique identifier of the merchant associated with this event. Detailed in the
        [Authentication specification](../authentication/).
    XAppSignature:
      in: header
      name: X-App-Signature
      required: true
      schema:
        type: string
      description: >
        HMAC-SHA256 signature of the raw request body, using the shared `client_secret`
        as key (lowercase hexadecimal). Algorithm detailed in the
        [Authentication specification](../authentication/).

  responses:
    BadRequest:
      description: Invalid request — malformed payload or incorrect parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Request without valid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict — duplicate, insufficient balance, or business rule violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected internal error while processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: Standard error response body.
      required: [code, message]
      properties:
        code:
          type: string
          description: Standardized error code.
        message:
          type: string
          description: Descriptive error message.
        details:
          type: array
          items:
            type: string
          description: Optional list of additional details.

    AsyncAcceptedResponse:
      type: object
      description: Acknowledgment of acceptance for an asynchronously processed operation.
      properties:
        status:
          type: string
          enum: [ACCEPTED]
          description: Confirmation that the request was accepted for asynchronous processing.
        correlationId:
          type: string
          description: Correlation identifier of the asynchronous operation for traceability.

    Identifier:
      type: object
      description: Canonical customer identifier — primary key for cross-system deduplication.
      required: [type, value]
      properties:
        type:
          type: string
          description: "Identifier type (`document`, `phone`, `email`, `external_id`, `custom`)."
        value:
          type: string
          description: Identifier value for the declared type.

    ExternalIdentifier:
      type: object
      description: "External identifier for correlation with third-party systems (e.g., POS, ERP)."
      required: [source, value]
      properties:
        source:
          type: string
          description: "Identifier of the source system (e.g., `pdv`, `crm`, `erp`)."
        value:
          type: string
          description: Identifier value in the source system.

    ContactPoint:
      type: object
      description: Customer contact point (phone, email, or other channel).
      required: [type, value]
      properties:
        type:
          type: string
          enum: [phone, email, other]
          description: Contact channel type.
        value:
          type: string
          description: "Contact channel value (e.g., `+5511999999999`, `maria@example.com`)."

    Consent:
      type: object
      description: Record of customer consent for a specific purpose and channel.
      properties:
        purpose:
          type: string
          description: "Purpose of the consent (e.g., `marketing`, `transactional`, `analytics`)."
        channel:
          type: string
          description: "Channel to which the consent applies (e.g., `email`, `sms`, `push`)."
        status:
          type: string
          enum: [opt_in, opt_out, legal_consent, revoked]
          description: Current consent status.
        source:
          type: string
          description: "Origin of the consent record (e.g., `checkout`, `app`, `pdv`)."
        grantedAt:
          type: string
          format: date-time
          description: Date/time when the consent was granted (ISO 8601).
        revokedAt:
          type: string
          format: date-time
          description: Date/time when the consent was revoked (ISO 8601).

    Address:
      type: object
      description: Customer address.
      properties:
        type:
          type: string
          description: "Address type (e.g., `home`, `work`, `delivery`)."
        street:
          type: string
          description: Street name.
        number:
          type: string
          description: Address number.
        complement:
          type: string
          description: "Complement (e.g., apartment, suite)."
        neighborhood:
          type: string
          description: Neighborhood.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State (UF).
        postalCode:
          type: string
          description: ZIP or postal code.
        country:
          type: string
          description: "Country (ISO 3166-1 alpha-2, e.g., `BR`)."

    Customer:
      type: object
      description: >
        Central entity of the Customer standard. The only required field is `identifier` —
        all other fields are optional and may be progressively enriched.
      required: [identifier]
      properties:
        id:
          type: string
          description: Internal customer identifier in the Software Service (CRM).
        merchantId:
          type: string
          description: |
            **[DRAFT — pendente comitê]** Identifier of the merchant (establishment)
            this customer record belongs to. Enables multi-store disambiguation when
            using `by_app` authentication model. The `merchantId` is the originator-owned
            identifier as defined in the Merchant capability.
        identifier:
          $ref: '#/components/schemas/Identifier'
        externalIds:
          type: array
          description: External identifiers for cross-system correlation and deduplication.
          items:
            $ref: '#/components/schemas/ExternalIdentifier'
        name:
          type: string
          description: Customer display name.
        contacts:
          type: array
          description: Customer contact channels (phone, email, etc.).
          items:
            $ref: '#/components/schemas/ContactPoint'
        birthDate:
          type: string
          format: date
          description: "Customer date of birth (ISO 8601 `YYYY-MM-DD`)."
        addresses:
          type: array
          description: Customer registered addresses.
          items:
            $ref: '#/components/schemas/Address'
        metadata:
          type: object
          additionalProperties: true
          description: "Extensible metadata for implementation-specific enrichment (e.g., restrictions, tags, custom rules)."
        consents:
          type: array
          description: Customer consent records by purpose and channel.
          items:
            $ref: '#/components/schemas/Consent'
        createdAt:
          type: string
          format: date-time
          description: Date/time of customer creation on the origin platform (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: Date/time of the last customer update (ISO 8601).

    CustomerUpsertRequest:
      type: object
      description: Batch of customers for import or synchronization.
      required: [items]
      properties:
        items:
          type: array
          description: List of customers to create or update.
          items:
            $ref: '#/components/schemas/Customer'

    CustomerListResponse:
      type: object
      description: Paginated customer query response.
      properties:
        items:
          type: array
          description: Customers returned in the current page.
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total records available for the applied filters.

    Lead:
      type: object
      description: Potential customer in acquisition phase — minimal structure without requiring full registration.
      properties:
        id:
          type: string
          description: Unique identifier of the lead.
        name:
          type: string
          description: Lead name, when available.
        contact:
          $ref: '#/components/schemas/ContactPoint'
        source:
          type: string
          description: "Channel or event that originated the lead (e.g., `cart_abandoned`, `menu_view`, `form`)."
        metadata:
          type: object
          additionalProperties: true
          description: Extensible metadata for implementation-specific enrichment.
        createdAt:
          type: string
          format: date-time
          description: Date/time of lead capture (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: Date/time of the last lead update (ISO 8601).

    LeadUpsertRequest:
      type: object
      description: Batch of leads for import or synchronization.
      required: [items]
      properties:
        items:
          type: array
          description: List of leads to create or update.
          items:
            $ref: '#/components/schemas/Lead'

    LeadListResponse:
      type: object
      description: Paginated lead query response.
      properties:
        items:
          type: array
          description: Leads returned in the current page.
          items:
            $ref: '#/components/schemas/Lead'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total records available for the applied filters.

    OriginChannel:
      type: string
      description: Order origin channel.
      enum:
        - own_app
        - marketplace
        - in_store
        - qr_code
        - kiosk
        - delivery
        - takeout
        - other

    OrderCustomerRef:
      type: object
      description: Reference to the customer linked to the order in CRM context.
      properties:
        identifier:
          $ref: '#/components/schemas/Identifier'
        externalIds:
          type: array
          description: Customer external identifiers for reconciliation.
          items:
            $ref: '#/components/schemas/ExternalIdentifier'

    Order:
      type: object
      description: >
        CRM view of the order — snapshot of the customer's purchase history for analytics
        and segmentation. Does not replicate the complete operational order lifecycle.
      properties:
        id:
          type: string
          description: Unique identifier of the order on the origin platform.
        storeId:
          type: string
          description: Identifier of the store/unit where the order was placed.
        originChannel:
          $ref: '#/components/schemas/OriginChannel'
        customer:
          $ref: '#/components/schemas/OrderCustomerRef'
        totalAmount:
          type: number
          description: Total order amount in cents (or base monetary unit of the country).
        items:
          type: array
          description: Order items relevant for relationship analytics (name, SKU, quantity, and price).
          items:
            type: object
            properties:
              sku:
                type: string
                description: Item SKU code.
              name:
                type: string
                description: Item display name.
              quantity:
                type: integer
                description: Quantity ordered.
              unitPrice:
                type: number
                description: Unit price in cents.
        metadata:
          type: object
          additionalProperties: true
          description: Extensible metadata for implementation-specific fields.
        createdAt:
          type: string
          format: date-time
          description: Date/time of order creation (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          description: Date/time of the last order update (ISO 8601).

    OrderUpsertRequest:
      type: object
      description: Batch of orders for import or synchronization in CRM context.
      required: [items]
      properties:
        items:
          type: array
          description: List of orders to create or update.
          items:
            $ref: '#/components/schemas/Order'

    OrderListResponse:
      type: object
      description: Paginated order query response in CRM context.
      properties:
        items:
          type: array
          description: Orders returned in the current page.
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total records available for the applied filters.

    RatingMethod:
      type: string
      description: Rating methodology used.
      enum: [stars, nps, binary, score, other]

    ReviewRating:
      type: object
      description: Individual rating within a review — supports multiple methodologies per record.
      properties:
        method:
          $ref: '#/components/schemas/RatingMethod'
        value:
          oneOf:
            - type: integer
            - type: number
            - type: boolean
            - type: string
          description: Rating value in the format compatible with the chosen methodology.
        scaleMin:
          type: number
          description: "Minimum scale value (e.g., 1 for 1-5 stars, 0 for NPS)."
        scaleMax:
          type: number
          description: "Maximum scale value (e.g., 5 for 1-5 stars, 10 for NPS)."
        isOverall:
          type: boolean
          default: false
          description: Indicates whether this rating is the overall score of the review.
        category:
          type: string
          description: "Rated category — open string without a closed enum in the MVP (e.g., `delivery`, `food_quality`, `price`)."
        question:
          type: string
          description: Question text associated with this rating, when applicable.
        comment:
          type: string
          description: Text comment associated with this specific rating.

    Review:
      type: object
      description: Review submitted by a customer about an order or experience.
      properties:
        id:
          type: string
          description: Unique identifier of the review.
        merchantId:
          type: string
          description: |
            **[DRAFT — pendente comitê]** Identifier of the merchant this review
            belongs to. Required for multi-store disambiguation. Without this field,
            reviews from N merchants are indistinguishable in a `by_app` context.
        customerIdentifier:
          $ref: '#/components/schemas/Identifier'
        orderId:
          type: string
          description: Identifier of the reviewed order, when applicable.
        source:
          type: string
          description: "System or channel of origin for the review (e.g., `app`, `crm`, `totem`)."
        ratings:
          type: array
          description: List of individual ratings that compose this review (supports multiple methodologies).
          items:
            $ref: '#/components/schemas/ReviewRating'
        comment:
          type: string
          description: General review comment, independent of individual ratings.
        createdAt:
          type: string
          format: date-time
          description: Date/time of review creation (ISO 8601).

    ReviewUpsertRequest:
      type: object
      description: Batch of reviews for import or synchronization in the CRM.
      required: [items]
      properties:
        items:
          type: array
          description: List of reviews to create or update.
          items:
            $ref: '#/components/schemas/Review'

    ReviewListResponse:
      type: object
      description: Paginated review query response.
      properties:
        items:
          type: array
          description: Reviews returned in the current page.
          items:
            $ref: '#/components/schemas/Review'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total records available for the applied filters.

    CustomerEventType:
      type: string
      description: Customer relationship event type.
      enum:
        - order.created
        - order.cancelled
        - order.delivered
        - cart.abandoned
        - customer.updated
        - customer.consent.updated
        - review.created

    CustomerEventEnvelope:
      type: object
      description: Customer relationship event envelope delivered via webhook.
      required: [eventType, occurredAt]
      properties:
        id:
          type: string
          description: Unique event identifier for idempotency.
        eventType:
          $ref: '#/components/schemas/CustomerEventType'
        occurredAt:
          type: string
          format: date-time
          description: Date/time of the business event occurrence (ISO 8601).
        customerIdentifier:
          $ref: '#/components/schemas/Identifier'
        orderId:
          type: string
          description: Identifier of the related order, when applicable.
        payload:
          type: object
          additionalProperties: true
          description: Supplementary payload specific to the event type.

    LoyaltyProgram:
      type: object
      description: Loyalty program — defines the scope, type, and configuration of the program.
      required: [id, name]
      properties:
        id:
          type: string
          description: Unique identifier of the loyalty program.
        merchantId:
          type: string
          description: |
            **[DRAFT — pendente comitê]** Identifier of the merchant that owns this
            program. Required when `ownerType` is `store`. For `chain`/`coalition`/`shared`
            programs, this field MAY be omitted or refer to a parent entity. Resolves
            the ambiguity where `ownerType: store` exists without identifying which store.
        name:
          type: string
          description: Program display name.
        ownerType:
          type: string
          enum: [store, chain, coalition, shared, other]
          description: "Owner type (`store`: individual store, `chain`: chain, `coalition`: multi-brand coalition, `shared`: shared)."
        status:
          type: string
          description: "Current program status (e.g., `active`, `inactive`, `suspended`)."
        metadata:
          type: object
          additionalProperties: true
          description: Extensible metadata for implementation-specific configurations.

    LoyaltyProgramUpsertRequest:
      type: object
      description: Batch of loyalty programs for registration or synchronization.
      required: [items]
      properties:
        items:
          type: array
          description: List of programs to create or update.
          items:
            $ref: '#/components/schemas/LoyaltyProgram'

    LoyaltyProgramListResponse:
      type: object
      description: Paginated loyalty program query response.
      properties:
        items:
          type: array
          description: Programs returned in the current page.
          items:
            $ref: '#/components/schemas/LoyaltyProgram'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total records available.

    LoyaltyBalanceType:
      type: string
      description: Loyalty account balance type.
      enum: [points, cashback, other]

    LoyaltyAccount:
      type: object
      description: Loyalty account linked to a customer and program. Groups balance, type, and loyalty metadata.
      properties:
        id:
          type: string
          description: Unique identifier of the loyalty account.
        programId:
          type: string
          description: Identifier of the program this account belongs to.
        customerId:
          type: string
          description: Identifier of the customer linked to the account.
        balanceType:
          $ref: '#/components/schemas/LoyaltyBalanceType'
        balance:
          type: number
          description: "Available balance in the account (points, currency, or other unit according to `balanceType`)."
        currency:
          type: string
          description: "Currency code when `balanceType` is `cashback` (ISO 4217, e.g., `BRL`)."
        expiresAt:
          type: string
          format: date-time
          description: Balance expiration date/time, when applicable (ISO 8601).
        metadata:
          type: object
          additionalProperties: true
          description: "Extensible metadata (e.g., tier, program enrollment date, account status)."

    LoyaltyAccountListResponse:
      type: object
      description: List of loyalty accounts for a customer.
      properties:
        items:
          type: array
          description: Loyalty accounts returned.
          items:
            $ref: '#/components/schemas/LoyaltyAccount'

    LoyaltyTransactionType:
      type: string
      description: Loyalty account transaction type.
      enum: [earn, redeem, adjust, expire, coupon_use, tier_change, other]

    LoyaltyTransaction:
      type: object
      description: Loyalty account transaction — earn, redeem, adjust, or expire.
      properties:
        id:
          type: string
          description: Unique identifier of the transaction.
        accountId:
          type: string
          description: Identifier of the related loyalty account.
        type:
          $ref: '#/components/schemas/LoyaltyTransactionType'
        amount:
          type: number
          description: Transaction amount (positive for earn, negative for redeem/expire).
        relatedOrderId:
          type: string
          description: Identifier of the order that originated the transaction, when applicable.
        occurredAt:
          type: string
          format: date-time
          description: Date/time when the transaction occurred (ISO 8601).
        metadata:
          type: object
          additionalProperties: true
          description: Supplementary transaction metadata.

    LoyaltyTransactionListResponse:
      type: object
      description: Paginated loyalty transaction query response.
      properties:
        items:
          type: array
          description: Transactions returned in the current page.
          items:
            $ref: '#/components/schemas/LoyaltyTransaction'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total transactions available for the applied filters.

    LoyaltyRewardType:
      type: string
      description: Redeemable reward type in the catalog.
      enum: [product, shipping, cashback, generic]

    LoyaltyReward:
      type: object
      description: Available reward in the loyalty program catalog for redemption.
      properties:
        id:
          type: string
          description: Unique identifier of the reward.
        programId:
          type: string
          description: Identifier of the program this reward belongs to.
        type:
          $ref: '#/components/schemas/LoyaltyRewardType'
        name:
          type: string
          description: "Reward display name (e.g., `R$10 Off`, `Free Shipping`, `Free Dessert`)."
        sku:
          type: string
          description: "Associated product SKU, when `type` is `product`."
        cost:
          type: number
          description: Cost in points/cashback required to redeem this reward.
        metadata:
          type: object
          additionalProperties: true
          description: "Extensible reward metadata (e.g., validity, image, usage restrictions)."

    LoyaltyRewardListResponse:
      type: object
      description: Paginated reward catalog query response.
      properties:
        items:
          type: array
          description: Rewards returned in the current page.
          items:
            $ref: '#/components/schemas/LoyaltyReward'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total rewards available for the applied filters.

    LoyaltyCoupon:
      type: object
      description: Loyalty or relationship coupon linked to a customer — generated by redemption or distributed by campaign.
      properties:
        id:
          type: string
          description: Unique identifier of the coupon.
        programId:
          type: string
          description: Identifier of the associated loyalty program, when applicable.
        customerId:
          type: string
          description: Identifier of the customer holding the coupon.
        code:
          type: string
          description: Coupon usage code (applied at checkout).
        status:
          type: string
          description: "Current coupon status (`available`, `applied`, `used`, `expired`, `cancelled`)."
        metadata:
          type: object
          additionalProperties: true
          description: "Extensible coupon metadata (e.g., type, value, usage restrictions)."
        expiresAt:
          type: string
          format: date-time
          description: Coupon expiration date/time (ISO 8601).

    LoyaltyCouponListResponse:
      type: object
      description: Paginated coupon query response.
      properties:
        items:
          type: array
          description: Coupons returned in the current page.
          items:
            $ref: '#/components/schemas/LoyaltyCoupon'
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Page size returned.
        total:
          type: integer
          description: Total coupons available for the applied filters.

    LoyaltyRedemptionRequest:
      type: object
      description: Request to redeem a reward from the catalog for the customer.
      required: [accountId, rewardId]
      properties:
        accountId:
          type: string
          description: Identifier of the customer's loyalty account performing the redemption.
        rewardId:
          type: string
          description: Identifier of the reward to be redeemed from the catalog.
        quantity:
          type: integer
          default: 1
          description: "Number of units to redeem (default: 1)."
        relatedOrderId:
          type: string
          description: Identifier of the order related to the redemption, when applicable.
        metadata:
          type: object
          additionalProperties: true
          description: Supplementary redemption metadata for traceability.

    LoyaltyEventType:
      type: string
      description: |
        Loyalty transaction event type.

        **[DRAFT — pendente comitê]** RC.2 additions: `loyalty.points.adjusted`,
        `loyalty.points.expired`, `loyalty.coupon.expired`, `loyalty.coupon.cancelled`
        — complete the event coverage for all transaction types and coupon terminal states.
      enum:
        - loyalty.points.earned
        - loyalty.cashback.earned
        - loyalty.redemption.created
        - loyalty.coupon.used
        - loyalty.tier.changed
        - loyalty.points.adjusted
        - loyalty.points.expired
        - loyalty.coupon.expired
        - loyalty.coupon.cancelled

    LoyaltyEventEnvelope:
      type: object
      description: Loyalty event envelope delivered via webhook to the Ordering Application.
      required: [eventType, occurredAt]
      properties:
        id:
          type: string
          description: Unique event identifier for idempotency.
        eventType:
          $ref: '#/components/schemas/LoyaltyEventType'
        occurredAt:
          type: string
          format: date-time
          description: Date/time of the business event occurrence (ISO 8601).
        accountId:
          type: string
          description: Identifier of the loyalty account related to the event.
        customerId:
          type: string
          description: Identifier of the customer related to the event.
        programId:
          type: string
          description: Identifier of the loyalty program related to the event.
        payload:
          type: object
          additionalProperties: true
          description: "Supplementary payload specific to the event type (e.g., points earned, tier reached)."
