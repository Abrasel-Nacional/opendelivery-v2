        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loyalty/programs:
    get:
      tags: [Loyalty]
      summary: List loyalty programs
      operationId: listLoyaltyPrograms
      description: |-
        Returns the paginated list of available loyalty programs.

        | **Hosted by** | Software Service (Loyalty) |
        |---|---|
        | **Called by** | Ordering Application |

        ```mermaid
        graph LR
            OA["Ordering Application"] -- GET --> SS["Software Service (Loyalty)"]
            style OA fill:#e0f2f1,stroke:#0f6f73,color:#0f6f73
            style SS fill:#fff3e0,stroke:#ef6c00,color:#ef6c00
