tags:
- name: ReleaseNotes
  x-displayName: Release notes
  x-traitTag: true
  description: |-
    ## Release Candidate status

    This contract is part of Open Delivery Protocol **V2.0.0-rc** (Release Candidate).
    It is published for **ecosystem validation**: company review and implementation pilots.
    Clarifying or corrective changes may still occur based on pilot feedback.
    A stable release will follow only after validation completes.
    **V1 remains the production reference** during the transition.

    ## Breaking changes from V1

    | Change | V1 | V2 |
    |---|---|---|
    | Merchant ID | Generated by PDV / Software Service | **Generated by Ordering Application (originator)**; PDV keeps `externalCode` |
    | Catalog updates | Monolithic `merchantUpdate` / `menuUpdated` webhook | **Two-model choice**: pull-only (`GET snapshot` in SS) OR push-based (`PUT snapshot` + CRUD in OA) |
    | Catalog sync model | Implicit / mixed | **Explicit declaration** in Discovery (`PULL`, `PUSH_FULL`, or `PUSH_CRUD`) — models are mutually exclusive |
    | Change notification | `POST /v1/menuUpdated` webhook (full payload) | **`POST …/snapshot/notify`** (lightweight ping, pull model only) |
    | Processing status | `GET /v1/merchantStatus` | **`GET /merchants/{id}/merchantStatus`** — same purpose, adapted response |
    | Service identification | Service object with its own `id` | **By `serviceType` only** (`DELIVERY`, `TAKEOUT`, `INDOOR`) |
    | `merchantType` | Present (e.g. RESTAURANT) | **Removed** |
    | Option pricing | `optionPrice` optional; confusing `subtotal` | **`optionPrice` required** (use `0` if free) — no `subtotal` |
    | Unit price | Implicit | **`unityPrice`** — explicit base price excluding options |
    | Operational availability | Not standardized | **`quantityAvailable`** on ItemOffer — operational signal, not multi-channel stock |
    | Temporary pause | Ad-hoc | **`POST …/services/{serviceType}/pause`** — does not change `serviceHours` |
    | Customization nesting | Single level (Item → Option) | **Recursive `OptionGroup`/`Option` nesting** — multi-level customization |

    ## RC Changelog

    Changes within the Release Candidate phase (post-publication, pre-stable).
    Each entry references the committee session that approved it.

    ### RC.2 — 2026-08-04 (Comitê 2026-07-28)

    **Catalog sync model** — clarified and formalized:
    - Sync models (`PULL`, `PUSH_FULL`, `PUSH_CRUD`) are now **mutually exclusive** for the primary update path.
    - Added `catalogSyncModel` field to Discovery declarations (MUST declare).
    - Added `POST …/snapshot/notify` endpoint — lightweight ping for pull-model cache invalidation.
    - Added `GET /merchants/{merchantId}/merchantStatus` endpoint — processing status check before sending new updates.
    - OA SHOULD return `409 Conflict` when a previous update is still processing.
    - `GET …/snapshot` remains available for bootstrap/recovery regardless of declared model.

    **Organizational:**
    - Sync-related endpoints moved to dedicated "Catalog Sync" section.
    - `Item.image` deprecated in favor of `images` array.

    ### RC.1 — 2026-07-15

    Initial Release Candidate publication.

- name: CapabilityOverview
  x-displayName: Overview
  x-traitTag: true
  description: |-
    ## Merchant capability

    Open Delivery Merchant defines how **Ordering Applications** and **Software Services**
    exchange **store identity**, **service contexts**, and **catalog**.

    > **Open Delivery is a protocol, not a product API.**
    > There is no central production host. Each party hosts the endpoints it is responsible for.

    ## Merchant stands alone

    Merchant **does not require** Orders. Platforms MAY implement Merchant without Orders
    (catalog and store only). Using Merchant together with Orders is the common full stack,
    but it is not mandatory — except that **Indoor** requires Orders separately.

    ## Async-first model

    State-change operations return `202 Accepted` (or `201` on resource create when the
    body is returned synchronously). Never treat `202` alone as final business confirmation —
    re-read via GET / snapshot when reconciling.

    ## Parties and responsibilities

    | Role | Responsibility |
    |---|---|
    | **Software Service** | Typical **host** of store and catalog endpoints (source of operational truth at the restaurant). |
    | **Ordering Application** | **Generates `merchantId`**, consumes store/catalog, may PATCH availability signals depending on the integration. |
    | **Delivery Platform** (optional) | Reads service availability / delivery area when needed. |

    Responsibilities by endpoint:

    | Endpoint family | Hosted by | Called by |
    |---|---|---|
    | `GET /merchants` (list authorized) | Token issuer / OA model | Application with app-scoped token |
    | **STORE** (identity & services) | | |
    | `GET/PATCH /merchants/{id}`, services, pause | **Ordering Application** | **Software Service** |
    | **CATALOG SYNC** (see [Catalog Sync](#tag/CatalogSyncPatterns)) | | |
    | Snapshot, notify, status | Depends on model | See sync patterns section |
    | **CATALOG CRUD** | | |
    | POST/PATCH/DELETE items, item offers, categories, option groups, options, availabilities | **Ordering Application** | **Software Service** |

    ## Catalog synchronization

    Catalog sync is a core concern of this capability. Three mutually exclusive
    models are available: **Pull**, **Push Full**, and **Push CRUD**. The model
    MUST be declared in Discovery via `catalogSyncModel`. Full details, rules,
    and endpoints are documented under the **[Catalog Sync](#tag/CatalogSyncPatterns)**
    section of this spec.

    ## Catalog hierarchy

    ```
    Merchant
    ├── Service (DELIVERY | TAKEOUT | INDOOR) → optional menuId
    └── Menu
        ├── Availability (referenced by id from Category / ItemOffer)
        ├── Item (name, description, nutrition, images, unit)
        └── Category
            ├── Subcategory (optional — one level of nesting)
            └── ItemOffer → itemId
                └── OptionGroup (recursive)
                    └── Option → itemId (optional), OptionGroup…
    ```

    ## Service status model

    | Status | Meaning |
    |---|---|
    | `OPEN` | Accepting orders for that service type |
    | `CLOSED` | Outside operating hours or permanently offline for the service |
    | `PAUSED` | Temporary operational pause (`pause` endpoint); does **not** rewrite `serviceHours` |

    ```mermaid
    stateDiagram-v2
        [*] --> OPEN
        OPEN --> PAUSED: POST …/pause
        PAUSED --> OPEN: duration ends or PATCH status OPEN
        OPEN --> CLOSED: schedule / operator
        CLOSED --> OPEN: schedule / operator
    ```

- name: CatalogSyncPatterns
  x-displayName: Catalog sync patterns
  x-traitTag: true
  description: |-
    Choose **one primary sync model** and declare it in
    [Discovery](../discovery/). The models are **mutually exclusive** for the
    primary catalog update path — combining pull and push-full for the same
    menu leads to race conditions and inconsistent state.

    ### Model exclusivity rules

    | Declaration | Primary update path | Allowed secondary use |
    |---|---|---|
    | `catalogSyncModel: PULL` | OA fetches `GET …/snapshot` (+ TTL / ping) | SS may NOT call `PUT …/snapshot` for routine updates |
    | `catalogSyncModel: PUSH_FULL` | SS sends `PUT …/snapshot` | OA may still call `GET …/snapshot` for error recovery only |
    | `catalogSyncModel: PUSH_CRUD` | SS calls POST/PATCH/DELETE per entity | OA may still call `GET …/snapshot` for bootstrap/reconciliation only |

    `GET …/snapshot` is **always available** regardless of model — but its role
    changes: in PULL it is the primary path; in PUSH models it is the fallback
    for bootstrap and disaster recovery.

    ### Pull — snapshot only

    **When to use:** read-only catalog consumption, bootstrap, reconciliation,
    or when the Software Service cannot host outbound calls.

    | Step | Who | Operation |
    |---|---|---|
    | 1 | Software Service | Hosts `GET /merchants/{id}/menus/{menuId}/snapshot` |
    | 2 | Ordering Application | Calls `GET …/snapshot` to fetch full catalog (on TTL expiry or ping) |
    | 3 | Ordering Application | Caches and indexes for serving orders |

    **Change notification (optional but recommended):** the Software Service
    calls `POST …/snapshot/notify` to inform the Ordering Application that the
    snapshot has changed, allowing immediate cache invalidation without waiting
    for TTL expiry. Without it, the OA relies solely on TTL-based polling.

    ### Push full — PUT snapshot

    **When to use:** the Software Service owns the full catalog and wants to
    push the complete state on every change (avoids delta calculation).

    | Step | Who | Operation |
    |---|---|---|
    | 1 | Software Service | Calls `PUT /merchants/{id}/menus/{menuId}/snapshot` with full menu |
    | 2 | Ordering Application | Replaces its entire cached catalog for that menu |
    | 3 | Ordering Application | Returns `202 Accepted` (processing may be async) |

    Before sending a new snapshot, the Software Service SHOULD check
    `GET …/merchantStatus` to confirm the previous update completed.
    If the Ordering Application is still processing, it SHOULD return
    `409 Conflict`.

    ### Push CRUD — incremental changes

    **When to use:** real-time catalog updates, incremental changes, when only
    specific fields change frequently (price, availability).

    | Scenario | Who | Operation | operationId |
    |---|---|---|---|
    | Incremental change (price, name, availability) | Software Service | PATCH entity | `updateItemOffer`, `updateCategory`, … |
    | New entity (item, category, option) | Software Service | POST | `createItemOffer`, `createCategory`, … |
    | Remove entity | Software Service | DELETE | `deleteItemOffer`, `deleteCategory`, … |

    All CRUD endpoints are **hosted by Ordering Application** and called by
    Software Service. Each call returns a synchronous status (`201`, `202`,
    `400`, `404`) — no async webhook processing to check.

    ### Bootstrap and error recovery

    Regardless of the declared model, `GET …/snapshot` remains available for:
    - **Initial catalog load** (first sync after onboarding)
    - **Disaster recovery** (data loss, system restore)
    - **Reconciliation** (detect drift after extended downtime)

    It MUST NOT be used as the routine update mechanism when the declared model
    is PUSH_FULL or PUSH_CRUD.

- name: IntegrationProfile
  x-displayName: Auth & Discovery
  x-traitTag: true
  description: |-
    ## Authentication

    All endpoints require `Authorization: Bearer {token}` unless marked otherwise.

    OAuth 2.0 grant models, scopes, and webhook signature validation (HMAC-SHA256)
    are defined in the [Authentication specification](../authentication/).

    Preferred scope for this capability: `od.merchant`.

    <SecurityDefinitions />

    ## Discovery declarations

    Implementations MUST publish Merchant capability behavior in
    [Discovery](../discovery/) so counterparties can integrate predictably.

    At minimum, declare:
    - `capabilities.merchant.version` and `capabilities.merchant.supported`.
    - Role declarations under `capabilities.merchant.originator` and/or `capabilities.merchant.receiver`.
    - Supported catalog entity operations via `supportedOperations`.
    - **`catalogSyncModel`** — the primary sync model for catalog updates:

    | Value | Meaning |
    |---|---|
    | `PULL` | OA fetches snapshot (SS hosts `GET …/snapshot`); SS may call `POST …/snapshot/notify` to signal changes |
    | `PUSH_FULL` | SS pushes full snapshot via `PUT …/snapshot` (OA hosts) |
    | `PUSH_CRUD` | SS pushes incremental changes via POST/PATCH/DELETE (OA hosts) |

    The declared model defines the **primary update path**. See
    [Catalog sync patterns](#tag/CatalogSyncPatterns) for exclusivity rules.

    ### Example Discovery fragment

    ```json
    {
      "capabilities": {
        "merchant": {
          "version": "2.0.0-rc.2",
          "supported": true,
          "catalogSyncModel": "PUSH_CRUD",
          "supportedOperations": [
            "getMerchant", "getMenuSnapshot", "getMerchantStatus",
            "createItemOffer", "updateItemOffer", "deleteItemOffer",
            "pauseService"
          ]
        }
      }
    }
    ```

