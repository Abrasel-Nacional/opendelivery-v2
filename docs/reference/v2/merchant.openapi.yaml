paths:

  # ---------------------------------------------------------------------------
  # Merchant listing
  # ---------------------------------------------------------------------------

  /merchants:
    get:
      tags: [Merchants]
      operationId: listMerchants
      summary: List authorized merchants
      description: |
        **[V2 NEW]** Returns all merchants authorized for the calling application.
        In the V2 per-application authentication model, a single token grants
        access to all merchants linked to that application.


        ```od-call-flow
        method: GET
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED, PAUSED] }
      responses:
        '200':
          description: List of merchants
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchants:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # Merchant basic info
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'

    get:
      tags: [Merchants]
      operationId: getMerchant
      summary: Get merchant details
      description: |
        **[V2 CHANGED]** Returns merchant identity and basic info.
        `merchantId` is owned by the Ordering Application; `externalCode` is the PDV key.
        In V1 this was part of the monolithic `GET /v1/merchant` which returned
        everything (basicInfo + services + menus). In V2, store identity is a
        separate endpoint from services and catalog.


        ```od-call-flow
        method: GET
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      responses:
        '200':
          description: Merchant details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
              examples:
                sample:
                  value:
                    id: merchant-550e8400
                    externalCode: loja-centro-sp
                    name: Burger House
                    status: OPEN
                    basicInfo:
                      name: Burger House
                      document: '22815773000169'
                      corporateName: Food Company
                      description: Smash burgers
                      averagePreparationTime: 20
                      minOrderValue: { value: 20, currency: BRL }
                      merchantCategories: [BURGERS, FAST_FOOD]
                      address:
                        street: Av. Paulista
                        number: '1000'
                        district: Bela Vista
                        city: São Paulo
                        state: BR-SP
                        country: BR
                        postalCode: 01310-100
                        complement: ''
                        latitude: -23.5613
                        longitude: -46.6558
                      contactEmails: [food@company.com]
                      contactPhones: { commercialNumber: '11999999999' }
                      logoImage: { URL: https://food-company.com/logo.jpg }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Merchants]
      operationId: updateMerchant
      summary: Partially update merchant basic info
      description: |
        **[V2 CHANGED]** Async update of merchant basic info. In V1 this was only
        possible via `POST /v1/menuUpdated` with `entityType: BASIC_INFO`. In V2
        it is a direct PATCH call.


        ```od-call-flow
        method: PATCH
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantPatch' }
      responses:
        '202': { description: Update accepted for processing }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Merchant Status (processing check)
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/merchantStatus:
    parameters:
      - $ref: '#/components/parameters/MerchantId'

    get:
      tags: [CatalogSync]
      operationId: getMerchantStatus
      summary: Check merchant update processing status
      description: |
        **[V2 CHANGED]** Returns the processing status of the last catalog or merchant update
        received by the Ordering Application. Use this endpoint to verify whether
        a previously sent snapshot or CRUD operation has been fully processed
        before sending further updates.

        This prevents race conditions where a new update overwrites or conflicts
        with a still-processing previous update (e.g., a full snapshot being
        ingested while an availability change arrives).

        **Recommended flow:**
        1. Software Service sends `PUT .../snapshot` or CRUD operations.
        2. Before sending the next batch, Software Service calls `GET .../merchantStatus`.
        3. If `processingState` is `PROCESSING`, wait and retry (with backoff).
        4. If `processingState` is `COMPLETED` or `FAILED`, proceed accordingly.

        If the Ordering Application cannot process a new update because a previous
        one is still in progress, it SHOULD return `409 Conflict` on the write
        endpoint rather than silently discarding the update.


        ```od-call-flow
        method: GET
        from: Software Service
        fromLabel: Client
        fromParty: ss
        to: Ordering Application
        toLabel: Host
        toParty: oa
        ```
      responses:
        '200':
          description: Current processing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantStatus' }
              examples:
                processing:
                  summary: Update still being processed
                  value:
                    processingState: PROCESSING
                    lastReceivedAt: "2026-07-28T10:15:00.000Z"
                    lastCompletedAt: "2026-07-28T09:00:00.000Z"
                    entityType: SNAPSHOT
                completed:
                  summary: Last update completed successfully
                  value:
                    processingState: COMPLETED
                    lastReceivedAt: "2026-07-28T10:15:00.000Z"
                    lastCompletedAt: "2026-07-28T10:15:32.000Z"
                    entityType: ITEM_OFFER
                failed:
                  summary: Last update failed
                  value:
                    processingState: FAILED
                    lastReceivedAt: "2026-07-28T10:15:00.000Z"
                    lastCompletedAt: "2026-07-28T10:15:05.000Z"
                    entityType: SNAPSHOT
                    failureReason: "Image validation failed for 3 items"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/services/{serviceType}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - name: serviceType
        in: path
        required: true
        schema:
          type: string
          enum: [DELIVERY, TAKEOUT, INDOOR]

    get:
      tags: [Services]
      operationId: getService
      summary: Get service configuration
      description: |
        **[V2 CHANGED]** Returns configuration for one service type. There is **no** separate service id —
        the path `{serviceType}` is the identifier. In V1 services had their own `id`;
        in V2 there is at most one service per type (`DELIVERY`, `TAKEOUT`, `INDOOR`).


        ```od-call-flow
        method: GET
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
              examples:
                deliveryOpen:
                  value:
                    serviceType: DELIVERY
                    status: OPEN
                    menuId: menu-lunch
                    serviceHours:
                      id: hours-delivery-01
                      weekHours:
                        - dayOfWeek: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
                          timePeriods: { startTime: "11:00:00.000Z", endTime: "23:00:00.000Z" }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Services]
      operationId: replaceService
      summary: Replace full service configuration
      description: |
        **[V2 NEW]** Full replace of service configuration (status, hours, delivery area, menuId).
        In V1 service updates were sent via the monolithic `menuUpdated` webhook
        with `entityType: SERVICE`.


        ```od-call-flow
        method: PUT
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceWrite' }
      responses:
        '202': { description: Update accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Services]
      operationId: updateService
      summary: Partially update service configuration
      description: |
        **[V2 NEW]** Partial update — e.g. set `status: OPEN` to end a pause early without rewriting hours.


        ```od-call-flow
        method: PATCH
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicePatch' }
      responses:
        '202': { description: Update accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchants/{merchantId}/services/{serviceType}/pause:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - name: serviceType
        in: path
        required: true
        schema:
          type: string
          enum: [DELIVERY, TAKEOUT, INDOOR]

    post:
      tags: [Services]
      operationId: pauseService
      summary: Temporarily pause a service
      description: |
        **[V2 NEW]** Pauses a specific service type for a configurable duration.
        Does **not** modify operating hours — temporary operational pause only.
        The service resumes automatically when the duration expires, or early via
        `PATCH …/services/{serviceType}` with `status: OPEN`.


        ```od-call-flow
        method: POST
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationMinutes]
              properties:
                durationMinutes:
                  type: integer
                  minimum: 1
                  description: How long to pause the service, in minutes
                  example: 30
                reason:
                  type: string
                  description: Human-readable reason for the pause
                  example: "Alta demanda — retomada em 30 minutos"
      responses:
        '202': { description: Pause accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Menus
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus:
    parameters:
      - $ref: '#/components/parameters/MerchantId'

    get:
      tags: [Menus]
      operationId: listMenus
      summary: List merchant menus
      description: |
        **[V2 CHANGED]** Lists menus for the merchant. Services may reference the active menu via `menuId`.
        In V1 menus were embedded in the monolithic `GET /v1/merchant` response.


        ```od-call-flow
        method: GET
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      responses:
        '200':
          description: List of menus
          content:
            application/json:
              schema:
                type: object
                properties:
                  menus:
                    type: array
                    items: { $ref: '#/components/schemas/MenuSummary' }

  /merchants/{merchantId}/menus/{menuId}/snapshot:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'

    get:
      tags: [CatalogSync]
      operationId: getMenuSnapshot
      summary: Get full menu snapshot
      description: |
        **[V2 NEW]** Returns the complete menu structure in a single response:
        categories, item offers, option groups and options. Use for **bootstrap**
        and full refresh. Prefer entity CRUD for incremental updates.
        In V1 this was `GET /v1/merchant` returning everything (store + catalog);
        in V2 it is scoped to a single menu and used for pull-model sync or recovery.


        ```od-call-flow
        method: GET
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      responses:
        '200':
          description: Full menu snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [CatalogSync]
      operationId: replaceMenuSnapshot
      summary: Replace full menu snapshot
      description: |
        **[V2 NEW]** Replaces the complete menu structure in a single transaction.
        Use when major catalog updates occur (e.g., seasonal menu change, reprocessing):
        the Software Service updates its catalog locally and pushes the complete
        snapshot to the Ordering Application.

        The `GET …/snapshot` endpoint remains available for bootstrap and error recovery.


        ```od-call-flow
        method: PUT
        from: Software Service
        fromLabel: Host
        fromParty: ss
        to: Ordering Application
        toLabel: Client
        toParty: oa
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuSnapshot' }
      responses:
        '202': { description: Menu snapshot update accepted for processing }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Menu change notification (ping for pull model)
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/snapshot/notify:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'

    post:
      tags: [CatalogSync]
      operationId: notifyMenuChange
      summary: Notify that the menu snapshot has changed
      description: |
        **[V2 NEW]** Lightweight notification ("ping") sent by the Software Service to the
        Ordering Application indicating that the menu snapshot has changed and
        should be re-fetched via `GET .../snapshot`.

        This endpoint is **only relevant for the pull model**: when the Ordering
        Application periodically fetches the snapshot and relies on TTL-based
        caching, this notification allows immediate cache invalidation without
        waiting for TTL expiry.

        Implementations using the **push model** (PUT snapshot or CRUD) do NOT
        need this endpoint — updates are already pushed directly.

        The body is intentionally minimal. The Ordering Application SHOULD
        invalidate its cached snapshot and schedule a new `GET .../snapshot`
        fetch at its earliest convenience.


        ```od-call-flow
        method: POST
        from: Software Service
        fromLabel: Client
        fromParty: ss
        to: Ordering Application
        toLabel: Host
        toParty: oa
        ```
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional human-readable reason for the change
                  example: "Menu updated — seasonal items added"
                changedAt:
                  type: string
                  format: date-time
                  description: Timestamp of the change on the Software Service side
                  example: "2026-07-28T10:15:00.000Z"
      responses:
        '202': { description: Notification received — snapshot will be re-fetched }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Categories
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/categories:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'

    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories in a menu
      description: |
        **[V2 NEW]** Lists all categories in a menu. In V1, categories were embedded in the
        monolithic `GET /v1/merchant` response. In V2 each entity has its own endpoint.
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a new category
      description: |
        **[V2 NEW]** Creates a category. In V1, category changes were sent via `POST /v1/menuUpdated`
        with `entityType: CATEGORY`. In V2 each entity has dedicated CRUD.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchants/{merchantId}/menus/{menuId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/CategoryId'

    put:
      tags: [Categories]
      operationId: replaceCategory
      summary: Replace a category
      description: |
        **[V2 NEW]** Full replace of a category entity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category
      description: |
        **[V2 NEW]** Removes a category from the menu.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Subcategories
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/categories/{categoryId}/subcategories:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/CategoryId'

    get:
      tags: [Categories]
      operationId: listSubcategories
      summary: List subcategories in a category
      description: |
        **[V2 NEW]** Lists nested subcategories within a parent category.
        Subcategories are a V2 addition — V1 had no nesting concept for categories.
      responses:
        '200':
          description: List of subcategories
          content:
            application/json:
              schema:
                type: object
                properties:
                  subcategories:
                    type: array
                    items: { $ref: '#/components/schemas/Subcategory' }

    post:
      tags: [Categories]
      operationId: createSubcategory
      summary: Create a new subcategory
      description: |
        **[V2 NEW]** Creates a nested subcategory within a parent category.
        Example: "Clássicos" within "Hambúrgueres".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubcategoryWrite' }
      responses:
        '201':
          description: Subcategory created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subcategory' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchants/{merchantId}/menus/{menuId}/categories/{categoryId}/subcategories/{subcategoryId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/CategoryId'
      - name: subcategoryId
        in: path
        required: true
        schema: { type: string }

    put:
      tags: [Categories]
      operationId: replaceSubcategory
      summary: Replace a subcategory
      description: |
        **[V2 NEW]** Full replace of a subcategory entity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubcategoryWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Categories]
      operationId: deleteSubcategory
      summary: Delete a subcategory
      description: |
        **[V2 NEW]** Removes a subcategory from its parent category.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Items — describes the sellable product; ItemOffer references it
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/items:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'

    get:
      tags: [Items]
      operationId: listItems
      summary: List items in a menu
      description: |
        **[V2 NEW]** Lists all items in a menu. In V1, items were embedded in the
        monolithic `GET /v1/merchant` response.
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }

    post:
      tags: [Items]
      operationId: createItem
      summary: Create a new item
      description: |
        **[V2 NEW]** Creates an item. Use `POST .../item-offers` afterwards to make it sellable
        (an `Item` describes the product; an `ItemOffer` prices and offers it).
        In V1, item changes were sent via `POST /v1/menuUpdated` with `entityType: ITEM`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemWrite' }
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchants/{merchantId}/menus/{menuId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/ItemId'

    get:
      tags: [Items]
      operationId: getItem
      summary: Get an item
      description: |
        **[V2 NEW]** Returns a single item by ID.
      responses:
        '200':
          description: Item details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Items]
      operationId: replaceItem
      summary: Replace an item
      description: |
        **[V2 NEW]** Full replace of an item entity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Items]
      operationId: deleteItem
      summary: Delete an item
      description: |
        **[V2 NEW]** Removes an item from the menu.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Item Offers
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/item-offers:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'

    get:
      tags: [ItemOffers]
      operationId: listItemOffers
      summary: List item offers
      description: |
        **[V2 NEW]** Lists item offers for a menu with optional filters.
      parameters:
        - name: categoryId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
      responses:
        '200':
          description: List of item offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemOffers:
                    type: array
                    items: { $ref: '#/components/schemas/ItemOffer' }

    post:
      tags: [ItemOffers]
      operationId: createItemOffer
      summary: Create a new item offer
      description: |
        **[V2 NEW]** Creates an item offer for an existing `Item` (see `itemId`). `unityPrice` is
        required. `optionPrice` on nested options is required when options are created.


        ```od-call-flow
        method: POST
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemOfferWrite' }
            examples:
              burger:
                value:
                  itemId: item-classic-burger
                  index: 0
                  unityPrice: { value: 25.00, originalValue: 25.00, currency: BRL }
                  status: AVAILABLE
                  quantityAvailable: 10
      responses:
        '201':
          description: Item offer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchants/{merchantId}/menus/{menuId}/item-offers/{itemOfferId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/ItemOfferId'

    put:
      tags: [ItemOffers]
      operationId: replaceItemOffer
      summary: Replace an item offer
      description: |
        **[V2 NEW]** Full replace of an item offer entity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemOfferWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [ItemOffers]
      operationId: updateItemOffer
      summary: Partially update an item offer
      description: |
        **[V2 NEW]** Use to update availability (`status`, `quantityAvailable`) without
        sending the full item structure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemOfferPatch' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [ItemOffers]
      operationId: deleteItemOffer
      summary: Delete an item offer
      description: |
        **[V2 NEW]** Removes an item offer.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Option Groups
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/item-offers/{itemOfferId}/option-groups:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/ItemOfferId'

    get:
      tags: [OptionGroups]
      operationId: listOptionGroups
      summary: List option groups for an item offer
      description: |
        **[V2 NEW]** Lists option groups for an item offer. In V1, option groups were
        embedded in the monolithic response.
      responses:
        '200':
          description: Option groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  optionGroups:
                    type: array
                    items: { $ref: '#/components/schemas/OptionGroup' }

    post:
      tags: [OptionGroups]
      operationId: createOptionGroup
      summary: Create an option group
      description: |
        **[V2 NEW]** Creates an option group for an item offer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionGroupWrite' }
      responses:
        '201':
          description: Option group created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptionGroup' }

  /merchants/{merchantId}/menus/{menuId}/item-offers/{itemOfferId}/option-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/ItemOfferId'
      - $ref: '#/components/parameters/GroupId'

    put:
      tags: [OptionGroups]
      operationId: replaceOptionGroup
      summary: Replace an option group
      description: |
        **[V2 NEW]** Full replace of an option group entity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionGroupWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [OptionGroups]
      operationId: deleteOptionGroup
      summary: Delete an option group
      description: |
        **[V2 NEW]** Removes an option group.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Options
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/item-offers/{itemOfferId}/option-groups/{groupId}/options:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/ItemOfferId'
      - $ref: '#/components/parameters/GroupId'

    get:
      tags: [Options]
      operationId: listOptions
      summary: List options in a group
      description: |
        **[V2 NEW]** Lists options within an option group.
      responses:
        '200':
          description: Options list
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items: { $ref: '#/components/schemas/Option' }

    post:
      tags: [Options]
      operationId: createOption
      summary: Create an option
      description: |
        **[V2 NEW]** Creates an option for an existing `Item` (see `itemId`) — an option has no
        name of its own, it inherits it from the referenced Item.
        **`optionPrice` is mandatory** (use value `0` when free).


        ```od-call-flow
        method: POST
        from: Ordering Application
        fromLabel: Client
        fromParty: oa
        to: Software Service
        toLabel: Host
        toParty: ss
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionWrite' }
            examples:
              freeOption:
                value:
                  itemId: item-medium-rare
                  optionPrice: { value: 0, originalValue: 0, currency: BRL }
                  status: AVAILABLE
              paidOption:
                value:
                  itemId: item-extra-cheese
                  optionPrice: { value: 3.00, originalValue: 3.00, currency: BRL }
                  status: AVAILABLE
      responses:
        '201':
          description: Option created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Option' }

  /merchants/{merchantId}/menus/{menuId}/item-offers/{itemOfferId}/option-groups/{groupId}/options/{optionId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/ItemOfferId'
      - $ref: '#/components/parameters/GroupId'
      - name: optionId
        in: path
        required: true
        schema: { type: string }

    put:
      tags: [Options]
      operationId: replaceOption
      summary: Replace an option
      description: |
        **[V2 NEW]** Full replace of an option entity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Options]
      operationId: deleteOption
      summary: Delete an option
      description: |
        **[V2 NEW]** Removes an option from its group.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Availability
  # ---------------------------------------------------------------------------

  /merchants/{merchantId}/menus/{menuId}/availabilities:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'

    get:
      tags: [Availabilities]
      operationId: listAvailabilities
      summary: List availabilities in a menu
      description: |
        **[V2 NEW]** Lists time-windowed availability schedules for the menu.
      responses:
        '200':
          description: List of availabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  availabilities:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }

    post:
      tags: [Availabilities]
      operationId: createAvailability
      summary: Create a new availability
      description: |
        **[V2 NEW]** Creates a time-windowed availability schedule, referenced by ID from
        `Category.availabilityId` and `ItemOffer.availabilityId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityWrite' }
      responses:
        '201':
          description: Availability created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchants/{merchantId}/menus/{menuId}/availabilities/{availabilityId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/AvailabilityId'

    get:
      tags: [Availabilities]
      operationId: getAvailability
      summary: Get an availability
      description: |
        **[V2 NEW]** Returns a single availability schedule by ID.
      responses:
        '200':
          description: Availability details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Availabilities]
      operationId: replaceAvailability
      summary: Replace an availability
      description: |
        **[V2 NEW]** Full replace of an availability schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityWrite' }
      responses:
        '202': { description: Update accepted }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Availabilities]
      operationId: deleteAvailability
      summary: Delete an availability
      description: |
        **[V2 NEW]** Removes an availability schedule.
      responses:
        '202': { description: Deletion accepted }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer Token issued via OAuth 2.0. Preferred scope for this capability: `od.menu`.
        See [Authentication](../authentication/).

  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      description: Merchant identifier (generated by the originator)
      schema: { type: string }
      example: merchant-550e8400
    MenuId:
      name: menuId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    ItemOfferId:
      name: itemOfferId
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient scope for the requested operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # -------------------------------------------------------------------------
    # Merchant
    # -------------------------------------------------------------------------

    MerchantSummary:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          description: '**[V2 CHANGED]** Merchant identifier — generated by the originator (Ordering Application). In V1 this was generated by the Software Service/PDV.'
          example: merchant-550e8400
        externalCode:
          type: string
          description: '**[V2 NEW]** Merchant''s internal identifier on the Software Service (PDV). Replaces the V1 concept where the PDV-generated id was the primary identifier.'
          example: loja-centro-sp
        name:
          type: string
          description: Merchant Public Name
          example: Burger House
        status:
          type: string
          enum: [OPEN, CLOSED, PAUSED]
          description: '**[V2 CHANGED]** Merchant operational status. In V1 this was AVAILABLE/UNAVAILABLE; in V2 it is OPEN/CLOSED/PAUSED.'

    Merchant:
      allOf:
        - $ref: '#/components/schemas/MerchantSummary'
        - type: object
          properties:
            basicInfo:
              description: Registration and contact data describing the merchant to end consumers.
              $ref: '#/components/schemas/MerchantBasicInfo'
            updatedAt:
              type: string
              format: date-time
              description: Date and time of the last update to the merchant data.

    MerchantBasicInfo:
      type: object
      description: Registration and contact data describing the merchant to end consumers.
      required:
        [name, document, corporateName, description, averagePreparationTime,
         minOrderValue, merchantCategories, address, contactEmails, contactPhones, logoImage]
      properties:
        name:
          type: string
          description: Merchant Public Name
          example: Burger House
        document:
          type: string
          description: Merchant document (CNPJ)
          pattern: '^\d{14}$'
          example: '22815773000169'
        corporateName:
          type: string
          description: Merchant corporate (legal) name
          maxLength: 500
          example: Food Company
        description:
          type: string
          description: Merchant Description
          example: Smash burgers
        averageTicket:
          type: number
          format: double
          description: Average ticket value. Not mandatory, but recommended to indicate price range.
          example: 90
        averagePreparationTime:
          type: number
          format: double
          description: Average amount of time preparing an order takes, in minutes.
          example: 20
        minOrderValue:
          description: Minimum order value accepted by the merchant.
          $ref: '#/components/schemas/Price'
        merchantCategories:
          type: array
          description: Merchant business categories
          items:
            type: string
            enum:
              [BURGERS, PIZZA, FAST_FOOD, HOT_DOG, JAPANESE, DESSERTS, AMERICAN,
               ICE_CREAM, BBQ, SANDWICH, MEXICAN, BRAZILIAN, PASTRY, ARABIAN,
               COMFORT_FOOD, VEGETARIAN, VEGAN, BAKERY, HEALTHY, ITALIAN, CHINESE,
               JUICE_SMOOTHIES, SEAFOOD, CAFE, SALADS, COFFEE_TEA, PASTA,
               BREAKFAST_BRUNCH, LATIN_AMERICAN, CONVENIENCE, PUB, HAWAIIAN,
               EUROPEAN, FAMILY_MEALS, FRENCH, INDIAN, PORTUGUESE, SPANISH,
               GOURMET, KIDS_FRIENDLY, SOUTH_AMERICAN, SPECIALTY_FOODS,
               ARGENTINIAN, PREMIUM, AFFORDABLE_MEALS]
          example: [PIZZA, FAMILY_MEALS, PREMIUM]
        address:
          description: Merchant Address
          $ref: '#/components/schemas/Address'
        contactEmails:
          type: array
          description: Merchant Contact Emails
          items: { type: string }
          example: [food@company.com]
        contactPhones:
          description: Merchant Contact Phones
          $ref: '#/components/schemas/ContactPhones'
        logoImage:
          description: Image to be used as the merchant logo
          $ref: '#/components/schemas/Image'
        bannerImage:
          description: Image to be used as the merchant banner
          $ref: '#/components/schemas/Image'
        createdAt:
          type: string
          format: date-time
          description: Merchant creation date and time.
        acceptedCards:
          type: array
          description: Card brands accepted by the merchant.
          items:
            type: string
            enum:
              [VISA, MASTERCARD, DINERS, AMEX, HIPERCARD, ELO, AURA, DISCOVER,
               VR_BENEFICIOS, SODEXO, TICKET, GOOD_CARD, BANESCARD, SOROCARD,
               POLICARD, VALECARD, AGICARD, JCB, CREDSYSTEM, CABAL, GREEN_CARD,
               VEROCHEQUE, AVISTA, OTHER]

    MerchantPatch:
      type: object
      properties:
        externalCode:
          type: string
          description: Merchant's internal identifier on the Software Service (PDV).
        name:
          type: string
          description: Merchant Public Name
        document:
          type: string
          description: Merchant Document (CNPJ)
        corporateName:
          type: string
          description: Merchant Corporate Name
        description:
          type: string
          description: Merchant Description
        averageTicket:
          type: number
          format: double
          description: Average Ticket. Can be used to show the price range of items available at the merchant.
        averagePreparationTime:
          type: number
          format: double
          description: Average amount of time preparing an order takes, in minutes.
        minOrderValue:
          $ref: '#/components/schemas/Price'
          description: Minimum order value that the merchant accepts.
        merchantCategories:
          type: array
          description: Merchant Categories
          items: { type: string }
        address:
          $ref: '#/components/schemas/Address'
          description: Merchant Address
        contactEmails:
          type: array
          description: Merchant Contact Emails
          items: { type: string }
        contactPhones:
          $ref: '#/components/schemas/ContactPhones'
          description: Merchant Contact Phones
        logoImage:
          $ref: '#/components/schemas/Image'
          description: Image to be used as the merchant logo
        bannerImage:
          $ref: '#/components/schemas/Image'
          description: Image to be used as the merchant banner
        acceptedCards:
          type: array
          description: Indicates which card brands are accepted by the merchant.
          items: { type: string }

    MerchantStatus:
      type: object
      description: |-
        **[V2 CHANGED]** Processing status of the last catalog or merchant update received by the
        Ordering Application. Allows the Software Service to check whether it is
        safe to send a new update without causing race conditions.
      required: [processingState, lastReceivedAt]
      properties:
        processingState:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
          description: |
            `PROCESSING` — the last update is still being ingested (do NOT send new updates).
            `COMPLETED` — the last update was successfully processed.
            `FAILED` — the last update failed (see `failureReason`).
        lastReceivedAt:
          type: string
          format: date-time
          description: Timestamp when the last update was received by the Ordering Application.
        lastCompletedAt:
          type: string
          format: date-time
          description: Timestamp when the last update finished processing (success or failure).
        entityType:
          type: string
          enum: [SNAPSHOT, CATEGORY, ITEM, ITEM_OFFER, OPTION_GROUP, OPTION, AVAILABILITY, SERVICE, BASIC_INFO]
          description: The type of entity that was last updated.
        failureReason:
          type: string
          description: Human-readable reason when `processingState` is `FAILED`.

    Address:
      type: object
      description: Physical address of the merchant.
      required:
        [country, state, city, district, street, number, postalCode, complement, latitude, longitude]
      properties:
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Two-letter ISO 3166-1 alpha-2 country code.
          example: BR
        state:
          type: string
          description: State or country subdivision.
          example: BR-SP
        city:
          type: string
          description: City name.
          example: São Paulo
        district:
          type: string
          description: District or neighborhood name.
          example: Moema
        street:
          type: string
          description: Street Name.
          example: Plaza Avenue
        number:
          type: string
          description: Street Number.
          example: "100"
        postalCode:
          type: string
          description: Postal Code
          example: "01310-100"
        complement:
          type: string
          description: Address complement.
          example: "BL 02 AP 31"
        reference:
          type: string
          description: Address reference.
          example: Yellow House
        latitude:
          type: number
          format: float
          description: Latitude in degrees. Values are restricted to the range [-90, 90].
          example: -23.54809
        longitude:
          type: number
          format: float
          description: Longitude in degrees. Values are restricted to the range [-180, 180].
          example: -46.63638

    ContactPhones:
      type: object
      required: [commercialNumber]
      properties:
        commercialNumber:
          type: string
          description: Telephone number of the merchant
          example: '11999999999'
        whatsappNumber:
          type: string
          description: Whatsapp number of the merchant
          example: '11998888888'

    Price:
      type: object
      description: Simple price object (used for minOrderValue and delivery-area fees).
      required: [value, currency]
      properties:
        value:
          type: number
          format: double
          description: Price value.
          example: 40
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: The 3-letter ISO 4217 currency code.
          example: BRL

    ItemPrice:
      type: object
      description: |-
        **[V2 CHANGED]** Price with an optional original (pre-discount) value and currency, used for
        `unityPrice` (ItemOffer) and `optionPrice` (Option). In V1 the price model
        was simpler and `originalValue` was not always present. In V2 both `value`
        and `originalValue` are required (set them equal when there is no discount).
      required: [value, originalValue, currency]
      properties:
        value:
          type: number
          format: double
          description: The actual price value.
          example: 25.00
        originalValue:
          type: number
          format: double
          description: The original (pre-discount) price value.
          example: 25.00
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: The 3-letter ISO 4217 currency code.
          example: BRL

    Image:
      type: object
      description: Image object with optional CRC-32 for change detection.
      required: [URL]
      properties:
        URL:
          type: string
          format: uri
          description: URL pointing to an image.
          example: https://food-company.com/image.jpg
        CRC-32:
          type: string
          format: CRC32
          description: CRC-32 of the image file. This field can be used to check for changes in the image file.
          example: '96b41025'

    ImageWithType:
      type: object
      description: |-
        Used for `Item.images` when size variations are needed. Considered only if
        the `images` array is non-empty; otherwise the single `image` field applies.
      required: [URL, type]
      properties:
        URL:
          type: string
          format: uri
          description: URL pointing to an image.
          example: https://food-company.com/image.jpg
        CRC-32:
          type: string
          format: CRC32
          description: CRC-32 of the image file. This field can be used to check for changes in the image file.
          example: '96b41025'
        type:
          type: string
          enum: [MAIN, THUMB]
          description: MAIN for larger images (item detail), THUMB for smaller ones (menu listing).

    # -------------------------------------------------------------------------
    # Services
    # -------------------------------------------------------------------------

    ServiceTiming:
      type: object
      description: Information regarding the accepted service times.
      properties:
        timing:
          type: array
          description: |
            `INSTANT` — orders prepared immediately.
            `SCHEDULED` — orders scheduled for a specific date/time.
            `ONDEMAND` — delivered only when the consumer indicates pickup.
            Defaults to `INSTANT` if not informed.
          items: { type: string, enum: [INSTANT, SCHEDULED, ONDEMAND] }
          default: [INSTANT]
          example: [INSTANT, SCHEDULED]
        schedule:
          type: object
          description: Time windows for scheduling. Only applies to `SCHEDULED` timing.
          required: [scheduleTimeWindow, scheduleStartWindow, scheduleEndWindow]
          properties:
            scheduleTimeWindow:
              type: string
              description: Interval between displayed scheduling slots.
              enum: [15_MINUTES, 30_MINUTES, 45_MINUTES, 60_MINUTES, 90_MINUTES, 120_MINUTES]
            scheduleStartWindow:
              type: string
              description: How long after opening the first schedule slot appears.
              enum: [15_MINUTES, 30_MINUTES, 45_MINUTES, 60_MINUTES, 90_MINUTES, 120_MINUTES]
            scheduleEndWindow:
              type: string
              description: How long before closing the last schedule slot appears.
              enum: [15_MINUTES, 30_MINUTES, 45_MINUTES, 60_MINUTES, 90_MINUTES, 120_MINUTES]

    Service:
      type: object
      description: |-
        **[V2 CHANGED]** Operational context for one order fulfillment type. A merchant may have at
        most one `Service` per `serviceType` — there is no separate service `id`.
        In V1, services had their own unique `id`; in V2 the path `{serviceType}` is the identifier.
      required: [serviceType, status, serviceHours]
      properties:
        serviceType:
          type: string
          description: |
            **[V2 CHANGED]** Service type replaces the V1 service `id` as identifier.
            `DELIVERY` — orders delivered to the customer's address.
            `TAKEOUT` — orders picked up at the establishment by the customer.
            `INDOOR` — orders consumed inside the establishment.
          enum: [DELIVERY, TAKEOUT, INDOOR]
        status:
          type: string
          enum: [OPEN, CLOSED, PAUSED]
          description: |
            **[V2 CHANGED]** In V1 this was AVAILABLE/UNAVAILABLE. In V2:
            `OPEN` — accepting orders; `CLOSED` — not accepting (hours/operator);
            `PAUSED` — temporary operational pause (see pause endpoint).
        menuId:
          type: string
          description: Active menu for this service (optional)
        serviceTiming:
          $ref: '#/components/schemas/ServiceTiming'
          description: Timing modes (INSTANT, SCHEDULED, ONDEMAND) and scheduling windows.
        servicePriority:
          type: array
          description: |
            Priority levels the merchant supports for order preparation/delivery.
            Only meaningful for Ordering Applications that work with delivery priorities.
          items: { type: string, enum: [PRIORITY1, PRIORITY2, PRIORITY3, PRIORITY4, PRIORITY5] }
          example: [PRIORITY1, PRIORITY2]
        targetAppId:
          type: string
          description: |
            For merchants that must send different menus for the same `serviceType`
            to different Ordering Applications (e.g. via an integration middleware).
        serviceArea:
          $ref: '#/components/schemas/ServiceArea'
          description: Delivery coverage area (only for DELIVERY type)
        serviceHours:
          $ref: '#/components/schemas/ServiceHours'
        pauseUntil:
          type: string
          format: date-time
          description: '**[V2 NEW]** When a PAUSED service will resume automatically'

    ServiceWrite:
      type: object
      required: [status, serviceHours]
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED]
          description: Service operational status.
        menuId:
          type: string
          description: Active menu for this service.
        serviceTiming:
          $ref: '#/components/schemas/ServiceTiming'
          description: Timing modes and scheduling windows.
        servicePriority:
          type: array
          description: Priority levels the merchant supports for order preparation/delivery.
          items: { type: string, enum: [PRIORITY1, PRIORITY2, PRIORITY3, PRIORITY4, PRIORITY5] }
        targetAppId:
          type: string
          description: Target Ordering Application identifier for multi-app routing.
        serviceArea:
          $ref: '#/components/schemas/ServiceArea'
          description: Delivery coverage area (only for DELIVERY type).
        serviceHours:
          $ref: '#/components/schemas/ServiceHours'
          description: Regular and holiday operating hours for this service.

    ServicePatch:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED, PAUSED]
          description: Service operational status.
        menuId:
          type: string
          description: Active menu for this service.
        serviceHours:
          $ref: '#/components/schemas/ServiceHours'
          description: Regular and holiday operating hours for this service.

    ServiceArea:
      type: object
      description: Geographical delivery coverage area, with optional tiered pricing and exclusion zones.
      required: [id]
      properties:
        id:
          type: string
          description: Unique identifier of the service area.
        polygon:
          type: array
          description: |
            Polygon(s) delivery area. If `polygon` is used, `geoRadius` is not required.
          items: { $ref: '#/components/schemas/Polygon' }
        geoRadius:
          $ref: '#/components/schemas/GeoRadius'
          description: If used, `polygon` is not required. Approximate radius (in meters) of the coverage circle.
        exclusionAreaPolygon:
          type: array
          description: |
            Polygons within the mapped delivery area where NO deliveries will be made.
            May be filled regardless of whether `polygon` or `geoRadius` is used.
          items: { $ref: '#/components/schemas/ExclusionPolygon' }

    Polygon:
      type: object
      required: [geoCoordinates]
      properties:
        geoCoordinates:
          type: array
          description: |
            Coordinates of each point of the polygon, in counter-clockwise direction.
            First and last points should be the same, though not required.
          items:
            type: object
            required: [latitude, longitude]
            properties:
              latitude:
                type: number
                format: float
                description: Latitude in degrees.
                example: -23.54809
              longitude:
                type: number
                format: float
                description: Longitude in degrees.
                example: -46.63638
        price:
          description: Price of the fee for this polygon.
          $ref: '#/components/schemas/Price'
        estimateDeliveryTime:
          type: integer
          description: Estimated delivery time for this polygon, in minutes.

    ExclusionPolygon:
      type: object
      required: [geoCoordinates]
      properties:
        geoCoordinates:
          type: array
          description: Coordinates of each point of the exclusion polygon.
          items:
            type: object
            required: [latitude, longitude]
            properties:
              latitude:
                type: number
                format: float
                description: Latitude in degrees.
                example: -23.54809
              longitude:
                type: number
                format: float
                description: Longitude in degrees.
                example: -46.63638

    GeoRadius:
      type: object
      required: [geoMidpointLatitude, geoMidpointLongitude, radius]
      properties:
        geoMidpointLatitude:
          type: number
          format: float
          description: Latitude of the center point of the coverage circle.
          example: -23.54809
        geoMidpointLongitude:
          type: number
          format: float
          description: Longitude of the center point of the coverage circle.
          example: -46.63638
        radius:
          type: array
          description: Radius tiers the merchant serves.
          items:
            type: object
            required: [size]
            properties:
              size: { type: integer, description: Radius size in meters. }
              price:
                $ref: '#/components/schemas/Price'
                description: Price of the delivery fee for this radius tier.
              estimateDeliveryTime: { type: integer, description: Estimated delivery time in minutes for this radius. }

    ServiceHours:
      type: object
      description: Regular and holiday operating hours for a service.
      required: [id, weekHours]
      properties:
        id:
          type: string
          description: Unique identifier of the service hours.
        weekHours:
          type: array
          description: Day(s) of the week and time periods for which the service is valid.
          items: { $ref: '#/components/schemas/Hours' }
        holidayHours:
          type: array
          description: |
            Holiday dates with optional `timePeriods`. If a date has no time period,
            the restaurant is closed that day. Optional — a merchant is not required
            to declare holiday-specific hours.
          items: { $ref: '#/components/schemas/HolidayHours' }

    Hours:
      type: object
      required: [dayOfWeek, timePeriods]
      properties:
        dayOfWeek:
          type: array
          description: Day of the week for which these service hours are valid.
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
          example: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        timePeriods:
          description: Time window from which orders can be placed.
          $ref: '#/components/schemas/TimePeriods'

    TimePeriods:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          format: time
          description: Indicates the specific time of day starting from which orders can be placed.
          example: "10:00:00.000Z"
        endTime:
          type: string
          format: time
          description: Indicates the specific time of day beyond which orders cannot be placed.
          example: "18:00:00.000Z"

    HolidayHours:
      type: object
      required: [date, timePeriods]
      properties:
        date:
          type: string
          format: date
          description: Holiday date in RFC3339 format.
          example: "2026-07-04"
        timePeriods:
          description: Time periods for the holiday.
          $ref: '#/components/schemas/TimePeriods'

    # -------------------------------------------------------------------------
    # Menus and Snapshot
    # -------------------------------------------------------------------------

    MenuSummary:
      type: object
      description: A menu belonging to a merchant, with the categories it contains.
      required: [id, merchantId, name, categoryId]
      properties:
        id:
          type: string
          description: A unique identifier of the menu.
        merchantId:
          type: string
          description: Identifier of the merchant that owns this menu.
        name:
          type: string
          description: Menu name
        description:
          type: string
          description: Menu Description
        externalCode:
          type: string
          description: Menu external code (typically the Software Service's menu code).
        disclaimer:
          type: string
          description: Disclaimer
        disclaimerURL:
          type: string
          format: uri
          description: Disclaimer URL
        categoryId:
          type: array
          description: |
            IDs of the `Category` entities that belong to this menu. Defaults to all
            categories being available in this menu if not informed.
          items: { type: string }
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the menu is Available or Unavailable.

    MenuSnapshot:
      type: object
      description: |-
        **[V2 NEW]** Complete menu structure for initial sync or full refresh. `lastUpdate` and
        `TTL` define the caching contract: consumers should re-fetch the snapshot
        once `TTL` (in seconds) has elapsed since `lastUpdate`. In V1 this was the
        monolithic `GET /v1/merchant` response; in V2 it is scoped per menu.
      required: [id, merchantId, name, lastUpdate, TTL, categories]
      properties:
        id:
          type: string
          description: A unique identifier of the menu.
        merchantId:
          type: string
          description: Identifier of the merchant that owns this menu.
        name:
          type: string
          description: Menu name
        description:
          type: string
          description: Menu Description
        externalCode:
          type: string
          description: Menu external code (typically the Software Service's menu code).
        disclaimer:
          type: string
          description: Disclaimer
        disclaimerURL:
          type: string
          format: uri
          description: Disclaimer URL
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the menu is Available or Unavailable.
        lastUpdate:
          type: string
          format: date-time
          description: Last modified date and time of this snapshot, in ISO timestamp format.
          example: '2026-07-04T20:45:10.332Z'
        TTL:
          type: integer
          description: |
            Time to live, in seconds (min 500, max 86400). A new snapshot request
            should be made once the TTL expires.
          example: 500
        categories:
          type: array
          description: Categories contained in this menu, each with their item offers and option groups.
          items:
            allOf:
              - $ref: '#/components/schemas/Category'
              - type: object
                properties:
                  itemOffers:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ItemOffer'
                        - type: object
                          properties:
                            optionGroups:
                              type: array
                              items: { $ref: '#/components/schemas/OptionGroup' }

    # -------------------------------------------------------------------------
    # Categories
    # -------------------------------------------------------------------------

    Category:
      type: object
      description: A section of the menu (e.g. "Burgers") where item offers are displayed.
      required: [id, index, name, externalCode, status]
      properties:
        id:
          type: string
          description: A unique identifier of the category.
        index:
          type: integer
          description: Category display index.
          example: 0
        name:
          type: string
          description: Category name.
          example: "Hambúrgueres"
        description:
          type: string
          description: Category description.
          example: "Salted pizza flavors."
        externalCode:
          type: string
          description: Category external code (typically the Software Service's category code).
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
        image:
          description: Image of the category.
          $ref: '#/components/schemas/Image'
        availabilityId:
          type: array
          description: |
            IDs of `Availability` entities describing when this category is available.
            If not informed, the category is assumed AVAILABLE at all times.
          items: { type: string }
        itemOfferId:
          type: array
          description: |
            IDs of the `ItemOffer` entities that belong to this category. Defaults to
            all item offers being available in this category if not informed.
          items: { type: string }
        templateTranslationId:
          type: string
          description: Identifier of the translation template associated with this category.
        subcategories:
          type: array
          description: '**[V2 NEW]** Nested subcategories (optional; allows one level of nesting)'
          items:
            $ref: '#/components/schemas/Subcategory'

    CategoryWrite:
      type: object
      required: [index, name, status]
      properties:
        index:
          type: integer
          description: Category display index.
        name:
          type: string
          description: Category name.
        description:
          type: string
          description: Category description.
        externalCode:
          type: string
          description: Category external code (typically the Software Service's category code).
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          default: AVAILABLE
          description: Indicates if the entity is Available or Unavailable.
        image:
          $ref: '#/components/schemas/Image'
          description: Image of the category.
        availabilityId:
          type: array
          description: IDs of Availability entities describing when this category is available.
          items: { type: string }
        itemOfferId:
          type: array
          description: IDs of the ItemOffer entities that belong to this category.
          items: { type: string }

    Subcategory:
      type: object
      required: [id, name, status]
      description: |
        **[V2 NEW]** Nested category level within a main category.
        Allows menu structures like "Hambúrgueres > Clássicos", "Bebidas > Quentes".
        V1 had no subcategory concept.
      properties:
        id:
          type: string
          description: A unique identifier of the subcategory.
        name:
          type: string
          description: Subcategory name.
          example: "Clássicos"
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
        displayOrder:
          type: integer
          description: Display position within the parent category
        imageUrl:
          type: string
          format: uri
          description: URL pointing to an image representing this subcategory.

    SubcategoryWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Subcategory name.
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          default: AVAILABLE
          description: Indicates if the entity is Available or Unavailable.
        displayOrder:
          type: integer
          description: Display position within the parent category.
        imageUrl:
          type: string
          format: uri
          description: URL pointing to an image representing this subcategory.

    # -------------------------------------------------------------------------
    # Items
    # -------------------------------------------------------------------------

    Item:
      type: object
      description: |-
        A sellable product — name, description, nutritional info, images and unit of
        measurement. Referenced by `ItemOffer.itemId` (to price and offer it) and
        optionally by `Option.itemId` (when an option is itself a catalog product).
      required: [id, name, description, externalCode, unit]
      properties:
        id:
          type: string
          description: A unique identifier of the item.
        name:
          type: string
          description: Item name
          maxLength: 150
          example: "1/2 Pepperoni"
        description:
          type: string
          description: Item Description
          example: "Pepperoni flavored pizza with LOTS of pepperoni."
        externalCode:
          type: string
          description: Item external code (typically the Software Service's item code).
          example: '233467'
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
          default: AVAILABLE
        image:
          deprecated: true
          description: |
            **[DEPRECATED]** Use `images` instead. This field is kept for backward
            compatibility only and will be removed in a future version.
            Considered only if `images` is empty.
          $ref: '#/components/schemas/Image'
        images:
          type: array
          maxItems: 2
          description: |
            Array of images with size variations. Primary image field for items.
            If non-empty, `image` is ignored.
          items: { $ref: '#/components/schemas/ImageWithType' }
        nutritionalInfo:
          $ref: '#/components/schemas/NutritionalInfo'
          description: Nutrition information for the dish.
        serving:
          type: integer
          description: Number of people the portion serves.
          example: 2
        unit:
          type: string
          description: |
            Item's unit of measurement: `UN` Unit, `KG` Kilogram, `L` Liter, `OZ` Ounce,
            `LB` Pound, `GAL` Gallon.
          enum: [UN, KG, L, OZ, LB, GAL]
          example: KG
        ean:
          type: string
          description: EAN (European Article Number)
          example: '7896005202074'

    ItemWrite:
      type: object
      required: [name, description, externalCode, unit]
      properties:
        name:
          type: string
          description: Item name
        description:
          type: string
          description: Item Description
        externalCode:
          type: string
          description: Item external code (typically the Software Service's item code).
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          default: AVAILABLE
          description: Indicates if the entity is Available or Unavailable.
        image:
          $ref: '#/components/schemas/Image'
          deprecated: true
          description: '**[DEPRECATED]** Use `images` instead.'
        images:
          type: array
          maxItems: 2
          description: Array of images with size variations.
          items: { $ref: '#/components/schemas/ImageWithType' }
        nutritionalInfo:
          $ref: '#/components/schemas/NutritionalInfo'
          description: Nutritional information for the item.
        serving:
          type: integer
          description: Number of people the portion serves.
        unit:
          type: string
          enum: [UN, KG, L, OZ, LB, GAL]
          description: Item unit of measurement.
        ean:
          type: string
          description: EAN (European Article Number)

    NutritionalInfo:
      type: object
      required: [description, calories]
      properties:
        description:
          type: string
          description: Nutrition information in free text, e.g. "Contains preservatives".
          example: "Contains preservatives"
        calories:
          type: string
          description: |
            Number of calories in Cal, kcal, or kJ: `value Cal` or `min-max Cal`.
          pattern: '^[0-9]+(\.[0-9]+)? ?(- ?[0-9]+(\.[0-9]+)?)? [a-zA-Z]+$'
          example: "2000 Cal"
        allergen:
          type: array
          description: Allergens of this item.
          items:
            type: string
            enum:
              [ALMONDS, ALPHA_ISOMETHYL_IONONE, ALCOHOL, AMYL_CINNAMAL, ANISE_ALCOHOL,
               BARLEY, BENZYL_ALCOHOL, BENZYL_BENZOATE, BENZYL_CINNAMATE, BENZYL_SALICYLATE,
               BRAZIL_NUTS, BUTYLPHENYL_METHYLPROPIONATE, CARROTS, CASHEW_NUTS, CELERY,
               CEREALS_CONTAINING_GLUTEN, CINNAMAL, CINNAMYL_ALCOHOL, CITRAL, CITRONELLOL,
               COCOA, CORIANDER, CORN, COUMARIN, CRUSTACEANS, EGGS, EUGENOL,
               EVERNIA_FURFURACEA, EVERNIA_PRUNASTRI, FARNESOL, FISH, GERANIOL, GLUTEN,
               HAZELNUTS, HEXYL_CINNAMAL, HYDROXYCITRONELLAL, KAMUT, LACTOSE, LUPINE,
               MACADAMIA_NUTS, METHYL_2_OCTYNOATE, MILK, MOLLUSCS, MUSTARD,
               NO_DECLARED_ALLERGENS, OAT, PEANUTS, PEAS, PECAN_NUTS, PISTACHIOS,
               POD_FRUITS, QUEENSLAND_NUTS, RYE, SESAME_SEEDS, SOYBEANS, SPELT,
               SULPHUR_DIOXIDE, TREE_NUTS, TREE_NUT_TRACES, WALNUTS, WHEAT]
            example: GLUTEN
        additives:
          type: array
          description: Additives of this item.
          items: { type: string }
        suitableDiet:
          type: array
          description: Dietary restrictions this item complies with.
          items:
            type: string
            enum:
              [DIABETIC, GLUTEN_FREE, HALAL, HINDU, KOSHER, LOW_CALORIE, LOW_FAT,
               LOW_LACTOSE, LOW_SALT, VEGAN, VEGETARIAN]
        isAlcoholic:
          type: boolean
          description: Indicates whether the item contains alcohol.
          example: false

    # -------------------------------------------------------------------------
    # Item Offers
    # -------------------------------------------------------------------------

    ItemOffer:
      type: object
      description: |-
        A sellable offer for an `Item`: its price, availability and quantity. Product
        details (name, description, images, nutrition) live on the referenced `Item`.
      required: [id, itemId, index, unityPrice]
      properties:
        id:
          type: string
          description: A unique identifier of the item offer.
        itemId:
          type: string
          description: The id of the `Item` entity correlated to this ItemOffer.
        index:
          type: integer
          description: ItemOffer display index.
          example: 0
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
          default: AVAILABLE
        unityPrice:
          description: |
            **[V2 NEW]** Base price of the item offer (does not include optional additions).
            Original and actual values can be informed, for showing discounts.
            In V1 this was implicit; in V2 it is explicit and required.
          $ref: '#/components/schemas/ItemPrice'
        quantityAvailable:
          type: integer
          nullable: true
          description: |
            **[V2 NEW]** Operational availability count. Not a stock control — it is an operational signal.
            `null` means no quantity limit declared. `0` means currently unavailable.
          example: 10
        availabilityId:
          type: array
          description: |
            IDs of `Availability` entities describing when this item offer is available.
            If not informed, the item offer is assumed AVAILABLE at all times.
          items: { type: string }
        optionGroupsId:
          type: array
          description: IDs of the child `OptionGroup` entities for this item offer.
          items: { type: string }

    ItemOfferWrite:
      type: object
      required: [itemId, index, unityPrice]
      properties:
        itemId:
          type: string
          description: The id of the Item entity correlated to this ItemOffer.
        index:
          type: integer
          description: ItemOffer display index.
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          default: AVAILABLE
          description: Indicates if the entity is Available or Unavailable.
        unityPrice:
          $ref: '#/components/schemas/ItemPrice'
          description: Base price of the item offer.
        quantityAvailable:
          type: integer
          nullable: true
          description: Operational availability count. Null means no quantity limit declared.
        availabilityId:
          type: array
          description: IDs of Availability entities describing when this item offer is available.
          items: { type: string }
        optionGroupsId:
          type: array
          description: IDs of the child OptionGroup entities for this item offer.
          items: { type: string }

    ItemOfferPatch:
      type: object
      description: Partial update — typically used to update availability
      properties:
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
        quantityAvailable:
          type: integer
          nullable: true
          description: Operational availability count. Null means no quantity limit declared.
        unityPrice:
          $ref: '#/components/schemas/ItemPrice'
          description: Base price of the item offer.

    # -------------------------------------------------------------------------
    # Option Groups (recursive)
    # -------------------------------------------------------------------------

    OptionGroup:
      type: object
      required: [id, index, name, externalCode, status, minPermitted, maxPermitted]
      description: |
        **[V2 CHANGED]** A group of customization options for an item offer (e.g. "Choose your steak
        point"). Option groups can be nested recursively — an option within a group
        can itself have option groups, allowing multi-level customization
        (e.g. size → cooking → sauce). Real-world usage is typically 2–3 levels deep.
        In V1 only single-level nesting was supported (Item → OptionGroup → Option).
      properties:
        id:
          type: string
          description: A unique identifier of the option group.
        index:
          type: integer
          description: Option group display index.
          example: 0
        name:
          type: string
          description: Option Group Name.
          example: "Ponto da carne"
        description:
          type: string
          description: Option Group Description.
          example: "Choose your steak point."
        externalCode:
          type: string
          description: Option group external code (typically the Software Service's code).
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
        minPermitted:
          type: integer
          description: Minimum number of options which must be selected in this group.
          example: 1
        maxPermitted:
          type: integer
          description: Maximum number of options which may be selected in this group.
          example: 1
        priceMethod:
          type: string
          description: |
            How this option group's price is calculated before being applied to the item:
            `SUM` (default) — added to other option groups without additional rules.
            `MAX` — the highest value among option groups with `priceMethod=MAX` applies.
            `AVG` — the average among option groups with `priceMethod=AVG` applies.
          enum: [SUM, MAX, AVG]
          default: SUM
        options:
          type: array
          description: List of options within this option group.
          items: { $ref: '#/components/schemas/Option' }

    OptionGroupWrite:
      type: object
      required: [index, name, externalCode, status, minPermitted, maxPermitted]
      properties:
        index:
          type: integer
          description: Option group display index.
        name:
          type: string
          description: Option Group Name.
        description:
          type: string
          description: Option Group Description.
        externalCode:
          type: string
          description: Option group external code (typically the Software Service's code).
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          default: AVAILABLE
          description: Indicates if the entity is Available or Unavailable.
        minPermitted:
          type: integer
          description: Minimum number of options which must be selected in this group.
        maxPermitted:
          type: integer
          description: Maximum number of options which may be selected in this group.
        priceMethod:
          type: string
          enum: [SUM, MAX, AVG]
          default: SUM
          description: How this option group's price is calculated before being applied to the item.

    # -------------------------------------------------------------------------
    # Options
    # -------------------------------------------------------------------------

    Option:
      type: object
      description: |-
        A selectable option within an `OptionGroup` (e.g. "Extra cheese", "Medium
        rare"). An option has no name of its own — it inherits it from the `Item`
        referenced via `itemId`, if any.
      required: [id, optionPrice, status]
      properties:
        id:
          type: string
          description: A unique identifier of the option.
        itemId:
          type: string
          description: The id of the `Item` entity correlated to this option, if any.
        index:
          type: integer
          description: Option display index.
          example: 0
        externalCode:
          type: string
          description: Option external code (typically the Software Service's option code).
        optionPrice:
          description: |
            **[V2 CHANGED]** Additional price for this option. MANDATORY — use value 0 for options
            that don't add cost. In V1 `optionPrice` was optional and `subtotal` was used
            (confusingly). In V2 `optionPrice` is always required and `subtotal` is removed.
          $ref: '#/components/schemas/ItemPrice'
        defaultQuantity:
          type: integer
          description: |
            **[V2 NEW]** Quantity included by default without selection.
            Used for pre-included ingredients (e.g., lettuce on a burger).
            Setting to 0 allows removal of default ingredients.
          example: 1
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Indicates if the entity is Available or Unavailable.
        maxPermitted:
          type: integer
          description: Maximum quantity of this option that can be selected in the group.
          example: 1
        imageUrl:
          type: string
          format: uri
          description: URL pointing to an image representing this option.
        optionGroups:
          type: array
          description: '**[V2 NEW]** Nested option groups for multi-level customization'
          items: { $ref: '#/components/schemas/OptionGroup' }

    OptionWrite:
      type: object
      required: [optionPrice]
      properties:
        itemId:
          type: string
          description: The id of the Item entity correlated to this option, if any.
        index:
          type: integer
          description: Option display index.
        externalCode:
          type: string
          description: Option external code (typically the Software Service's option code).
        optionPrice:
          $ref: '#/components/schemas/ItemPrice'
          description: Additional price for this option. Use value 0 for free options.
        defaultQuantity:
          type: integer
          description: Quantity included by default without selection.
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          default: AVAILABLE
          description: Indicates if the entity is Available or Unavailable.
        imageUrl:
          type: string
          format: uri
          description: URL pointing to an image representing this option.

    # -------------------------------------------------------------------------
    # Availability
    # -------------------------------------------------------------------------

    Availability:
      type: object
      description: |-
        **[V2 CHANGED]** A time-windowed schedule describing when a `Category` or `ItemOffer` is
        served, referenced by ID via `availabilityId`. Distinct from
        `quantityAvailable`, which signals operational stock rather than timing.
        In V1 this entity existed but had no dedicated CRUD — it was embedded in the
        monolithic `GET /v1/merchant` response.
      required: [id, hours]
      properties:
        id:
          type: string
          description: A unique identifier of the availability schedule.
        startDate:
          type: string
          description: Availability start date. If not informed, already available.
          example: "2026-05-27"
        endDate:
          type: string
          description: Availability end date. If not informed, always available.
          example: "2026-05-30"
        hours:
          type: array
          description: Time-windowed schedule entries defining when the entity is available.
          items: { $ref: '#/components/schemas/Hours' }

    AvailabilityWrite:
      type: object
      required: [hours]
      properties:
        startDate:
          type: string
          description: Availability start date. If not informed, already available.
        endDate:
          type: string
          description: Availability end date. If not informed, always available.
        hours:
          type: array
          description: Time-windowed schedule entries defining when the entity is available.
          items: { $ref: '#/components/schemas/Hours' }

    # -------------------------------------------------------------------------
    # Shared
    # -------------------------------------------------------------------------

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Number of items per page.
        totalItems:
          type: integer
          description: Total number of items across all pages.
        totalPages:
          type: integer
          description: Total number of pages.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: MERCHANT_NOT_FOUND
        message:
          type: string
          description: Human-readable error description
          example: Merchant with id 'merchant-123' was not found
        details:
          type: array
          description: Array of field-level validation details
          items:
            type: object
            properties:
              field:
                type: string
                description: Name of the field that caused the validation error.
              issue:
                type: string
                description: Description of the validation issue for this field.
