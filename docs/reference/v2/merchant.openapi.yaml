info:
  title: Open Delivery V2 — Merchant
  version: 2.0.0-rc.2
  summary: Normative Merchant contracts — store identity, services, and catalog CRUD
  description: |-
    This specification is the **normative, self-contained contract** of Open Delivery
    for the **merchant domain**: store identity, operational services
    (`DELIVERY` / `TAKEOUT` / `INDOOR`), and **catalog** (menus, categories, items,
    item offers, option groups, options, availability).

    Recommended reading flow in ReDoc:
    1. **Release notes** (RC status and V1 breaking changes)
    2. **Overview** (model, parties, and catalog hierarchy)
    3. **Integration** (authentication and Discovery declarations)
    4. **Catalog sync patterns** (pull vs. push — pick one or combine both)
    5. **Store** (merchant data and services)
    6. **Catalog** (menus, categories, items, options)
    7. **External docs** (related capabilities and guides)

    An implementer MUST be able to integrate this capability using **only this document**.
    Related guides are listed under **External docs**.
